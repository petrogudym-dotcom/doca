<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Архитектура приложений — Справочник</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --bg-secondary: #f7f6f3;
    --bg-tertiary: #f0efe9;
    --text: #1a1a18;
    --text-secondary: #5a5a55;
    --text-tertiary: #9a9a92;
    --border: rgba(0,0,0,0.1);
    --border-med: rgba(0,0,0,0.18);
    --radius: 8px;
    --radius-lg: 12px;
    --font: 'Inter', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a18;
      --bg-secondary: #242420;
      --bg-tertiary: #2c2c28;
      --text: #f0efe9;
      --text-secondary: #a0a098;
      --text-tertiary: #606058;
      --border: rgba(255,255,255,0.1);
      --border-med: rgba(255,255,255,0.18);
    }
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    border-bottom: 0.5px solid var(--border);
    padding: 1.25rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
    backdrop-filter: blur(8px);
  }
  .header-left h1 { font-size: 17px; font-weight: 600; color: var(--text); }
  .header-left p { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }

  .breadcrumb {
    display: flex; align-items: center; gap: 5px;
    font-size: 12px; color: var(--text-tertiary);
  }
  .breadcrumb a {
    color: var(--text-tertiary); text-decoration: none;
    transition: color 0.15s;
  }
  .breadcrumb a:hover { color: var(--text-secondary); text-decoration: underline; }
  .breadcrumb span.sep { color: var(--text-tertiary); opacity: 0.5; }
  .breadcrumb span.current { color: var(--text-secondary); }

  .search-wrap {
    position: relative;
    flex: 1;
    max-width: 280px;
  }
  .search-wrap svg {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px; height: 14px;
    color: var(--text-tertiary);
    pointer-events: none;
  }
  .search-wrap input {
    width: 100%;
    padding: 8px 12px 8px 32px;
    font-size: 13px;
    font-family: var(--font);
    border: 0.5px solid var(--border-med);
    border-radius: 20px;
    background: var(--bg-secondary);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  .search-wrap input:focus { border-color: #7f77dd; }
  .search-wrap input::placeholder { color: var(--text-tertiary); }

  /* LAYOUT */
  .layout { display: flex; min-height: calc(100vh - 64px); }

  /* SIDEBAR */
  .sidebar {
    width: 200px;
    flex-shrink: 0;
    border-right: 0.5px solid var(--border);
    padding: 1.25rem 0;
    position: sticky;
    top: 64px;
    height: calc(100vh - 64px);
    overflow-y: auto;
  }
  .sidebar-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-tertiary);
    padding: 0 1rem 8px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 1rem;
    font-size: 13px;
    color: var(--text-secondary);
    cursor: pointer;
    border-radius: 0;
    transition: all 0.12s;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
  }
  .nav-item:hover { color: var(--text); background: var(--bg-secondary); }
  .nav-item.active {
    color: var(--text);
    background: var(--bg-tertiary);
    font-weight: 500;
    border-right: 2px solid #7f77dd;
  }
  .nav-item .icon { font-size: 14px; width: 18px; text-align: center; }
  .nav-badge {
    margin-left: auto;
    font-size: 10px;
    color: var(--text-tertiary);
    background: var(--bg-tertiary);
    padding: 1px 6px;
    border-radius: 10px;
  }

  /* MAIN */
  .main { flex: 1; padding: 2rem; max-width: 900px; }

  /* SECTION */
  .section-block { margin-bottom: 2.5rem; }
  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 1rem;
    padding-bottom: 10px;
    border-bottom: 0.5px solid var(--border);
  }
  .section-icon {
    width: 30px; height: 30px;
    border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; flex-shrink: 0;
  }
  .section-title { font-size: 15px; font-weight: 600; color: var(--text); }
  .section-count { margin-left: auto; font-size: 12px; color: var(--text-tertiary); }

  .topics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 10px;
  }

  /* CARD */
  .topic-card {
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1rem 1.125rem;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .topic-card:hover { border-color: var(--border-med); }
  .topic-card.expanded { border-color: #7f77dd; }

  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .card-name { font-size: 14px; font-weight: 500; color: var(--text); line-height: 1.3; }
  .card-tag {
    font-size: 10px; padding: 2px 7px;
    border-radius: 10px; flex-shrink: 0; margin-top: 2px; font-weight: 500;
  }
  .tag-pattern  { background: #EEEDFE; color: #3C3489; }
  .tag-style    { background: #E1F5EE; color: #085041; }
  .tag-principle{ background: #FAEEDA; color: #633806; }
  .tag-infra    { background: #E6F1FB; color: #0C447C; }
  .tag-security { background: #FAECE7; color: #712B13; }
  .tag-scale    { background: #EAF3DE; color: #27500A; }

  @media (prefers-color-scheme: dark) {
    .tag-pattern  { background: #26215C; color: #CECBF6; }
    .tag-style    { background: #04342C; color: #9FE1CB; }
    .tag-principle{ background: #412402; color: #FAC775; }
    .tag-infra    { background: #042C53; color: #B5D4F4; }
    .tag-security { background: #4A1B0C; color: #F5C4B3; }
    .tag-scale    { background: #173404; color: #C0DD97; }
  }

  .card-summary { font-size: 12px; color: var(--text-secondary); margin-top: 6px; line-height: 1.5; }

  .card-details {
    display: none;
    margin-top: 12px;
    border-top: 0.5px solid var(--border);
    padding-top: 12px;
  }
  .topic-card.expanded .card-details { display: block; }

  /* LEVELS */
  .levels { display: flex; gap: 5px; margin-bottom: 12px; flex-wrap: wrap; }
  .level-btn {
    font-size: 11px; padding: 4px 10px;
    border: 0.5px solid var(--border);
    border-radius: 20px;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    font-family: var(--font);
    transition: all 0.12s;
  }
  .level-btn:hover { border-color: var(--border-med); color: var(--text); }
  .level-btn.lv1 { background: #FAEEDA; color: #633806; border-color: #FAC775; }
  .level-btn.lv2 { background: #FAECE7; color: #712B13; border-color: #F0997B; }
  .level-btn.lv3 { background: #FCEBEB; color: #791F1F; border-color: #F09595; }
  @media (prefers-color-scheme: dark) {
    .level-btn.lv1 { background: #412402; color: #FAC775; border-color: #633806; }
    .level-btn.lv2 { background: #4A1B0C; color: #F5C4B3; border-color: #712B13; }
    .level-btn.lv3 { background: #501313; color: #F7C1C1; border-color: #791F1F; }
  }

  .level-content { font-size: 13px; color: var(--text); line-height: 1.65; }

  .tradeoffs {
    margin-top: 10px; padding: 8px 10px;
    background: var(--bg-secondary);
    border-radius: var(--radius);
    font-size: 12px;
    color: var(--text-secondary);
  }
  .tradeoffs-label {
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-tertiary); margin-bottom: 4px;
  }

  .code-block {
    margin-top: 10px;
    background: var(--bg-secondary);
    border-radius: var(--radius);
    padding: 10px 12px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--text);
    line-height: 1.65;
    white-space: pre;
    overflow-x: auto;
    border: 0.5px solid var(--border);
  }

  .questions { margin-top: 10px; }
  .questions-label {
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-tertiary); margin-bottom: 6px;
  }
  .q-item {
    font-size: 12px; color: var(--text-secondary);
    padding: 5px 0;
    border-bottom: 0.5px solid var(--border);
    line-height: 1.45;
    display: flex; gap: 6px;
  }
  .q-item:last-child { border-bottom: none; }
  .q-arrow { color: var(--text-tertiary); flex-shrink: 0; }

  .links-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .ext-link {
    font-size: 11px; padding: 4px 10px;
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    color: #185FA5;
    text-decoration: none;
    background: var(--bg);
    transition: background 0.12s;
  }
  .ext-link:hover { background: var(--bg-secondary); }
  @media (prefers-color-scheme: dark) { .ext-link { color: #85B7EB; } }

  .no-results {
    text-align: center; padding: 3rem;
    color: var(--text-tertiary); font-size: 14px;
  }

  /* RESPONSIVE */
  @media (max-width: 640px) {
    .sidebar { display: none; }
    .header { padding: 1rem; }
    .main { padding: 1rem; }
    .topics-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <nav class="breadcrumb" aria-label="Навигация">
      <a href="../">doca</a>
      <span class="sep">/</span>
      <span class="current">Архитектура приложений</span>
    </nav>
    <h1>Архитектура приложений</h1>
    <p>Личный справочник · 30 тем · 3 уровня глубины</p>
  </div>
  <div class="search-wrap">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <circle cx="6.5" cy="6.5" r="4"/>
      <path d="M11 11l2.5 2.5"/>
    </svg>
    <input type="text" id="search" placeholder="Поиск..." aria-label="Поиск по справочнику">
  </div>
</header>

<div class="layout">
  <nav class="sidebar" aria-label="Разделы справочника">
    <div class="sidebar-label">Разделы</div>
    <div id="sidebarNav"></div>
  </nav>
  <main class="main" id="mainContent"></main>
</div>

<script>
const DATA = [
  {
    id:'basics', title:'Основы', icon:'📐', iconBg:'#FFF3E0',
    topics:[
      {
        name:'SOLID', tag:'principle', tagLabel:'Принцип',
        summary:'5 принципов ООП-дизайна, снижающих связность кода и упрощающих поддержку.',
        short:'Single Responsibility, Open/Closed, Liskov Substitution, Interface Segregation, Dependency Inversion. Каждый класс — одна причина изменения.',
        medium:{
          theory:'SRP — один класс, одна ответственность. OCP — открыт для расширения, закрыт для изменения. LSP — наследники заменяют базовый класс без сюрпризов. ISP — интерфейсы дробить по смыслу. DIP — зависить от абстракций, не от конкретных реализаций.',
          tradeoffs:'Плюс: низкая связность, тестируемость, гибкость. Минус: больше классов и файлов, может быть overkill для маленьких проектов.',
          code:`// SRP: разделяем парсинг и сохранение
class OrderParser { parse(data) { ... } }
class OrderRepository { save(order) { ... } }

// DIP: зависим от интерфейса, не от реализации
class OrderService {
  constructor(private repo: IOrderRepository) {}
  create(data) { return this.repo.save(new Order(data)) }
}`
        },
        links:[
          {label:'Martin Fowler — Design', url:'https://martinfowler.com/tags/design.html'},
          {label:'Uncle Bob — SOLID', url:'https://blog.cleancoder.com'}
        ],
        questions:['Нарушает ли God Object принцип SRP?','Как DIP помогает при тестировании?','Чем отличается ISP от SRP?']
      },
      {
        name:'DRY, KISS, YAGNI', tag:'principle', tagLabel:'Принцип',
        summary:'Три ключевых принципа простого и поддерживаемого кода.',
        short:'DRY — не повторяй себя. KISS — делай просто. YAGNI — не пиши то, что не нужно прямо сейчас.',
        medium:{
          theory:'DRY (Don\'t Repeat Yourself) — каждое знание имеет одно авторитетное место в системе. KISS (Keep It Simple) — простое решение лучше умного. YAGNI (You Aren\'t Gonna Need It) — не добавляй функциональность "на будущее".',
          tradeoffs:'Конфликт DRY vs KISS: DRY требует абстракций, KISS — простоты. Преждевременная абстракция (DRY раньше времени) создаёт сложность без пользы.',
          code:`// Нарушение DRY:
function calcUserTax(u) { return u.income * 0.13 }
function calcCompanyTax(c) { return c.income * 0.13 }

// DRY:
function calcTax(entity, rate = 0.13) {
  return entity.income * rate
}`
        },
        links:[{label:'YAGNI — Martin Fowler', url:'https://martinfowler.com/bliki/Yagni.html'}],
        questions:['Когда DRY вреден?','Как YAGNI связан с итеративной разработкой?','Что такое "wrong DRY"?']
      },
      {
        name:'Coupling & Cohesion', tag:'principle', tagLabel:'Принцип',
        summary:'Связность (cohesion) и зацепление (coupling) — два фундаментальных качества дизайна.',
        short:'Высокая cohesion (один модуль — одна тема) + низкий coupling (модули не знают деталей друг друга) = хорошая архитектура.',
        medium:{
          theory:'Coupling: насколько сильно один модуль зависит от внутренностей другого. Cohesion: насколько элементы внутри модуля связаны по смыслу. Цель: High Cohesion, Low Coupling.',
          tradeoffs:'Слабое зацепление упрощает изменения и тестирование в изоляции. Но иногда tight coupling оправдан ради производительности.',
          code:`// Tight coupling (плохо — знает о деталях БД):
class Order {
  save() { db.query('INSERT INTO orders...') }
}

// Loose coupling (лучше — зависит от интерфейса):
class Order {
  save(repo: IRepository) { repo.save(this) }
}`
        },
        links:[{label:'Coupling vs Cohesion', url:'https://wiki.c2.com/?CouplingAndCohesion'}],
        questions:['Что хуже: высокий coupling или низкая cohesion?','Как DI снижает coupling?']
      }
    ]
  },
  {
    id:'styles', title:'Архитектурные стили', icon:'🏛️', iconBg:'#E8F5E9',
    topics:[
      {
        name:'Monolith', tag:'style', tagLabel:'Стиль',
        summary:'Всё приложение — один деплоймент. Простота разработки, сложность масштабирования.',
        short:'Единый деплойный артефакт. UI, бизнес-логика и БД в одном приложении. Отличный старт для большинства проектов.',
        medium:{
          theory:'Monolith — все компоненты работают в одном процессе. Легко разрабатывать, отлаживать, тестировать. Становится проблемой при росте команды и необходимости независимого масштабирования частей.',
          tradeoffs:'Плюс: простота, нет сетевых задержек, ACID-транзакции. Минус: всё масштабируется вместе, технологический lock-in, сложный CI при большой команде.',
          code:`// Структура Modular Monolith — лучший вариант монолита:
src/
  modules/
    orders/     ← изолированный модуль (свои entity, service, repo)
    users/      ← изолированный модуль
    payments/   ← изолированный модуль
  shared/       ← общие утилиты, интерфейсы
  main.ts`
        },
        links:[
          {label:'Monolith First — Fowler', url:'https://martinfowler.com/bliki/MonolithFirst.html'},
          {label:'Modular Monolith', url:'https://www.milanjovanovic.tech/blog/what-is-a-modular-monolith'}
        ],
        questions:['Когда монолит лучше микросервисов?','Что такое Modular Monolith?','Как правильно декомпозировать монолит на сервисы?']
      },
      {
        name:'Microservices', tag:'style', tagLabel:'Стиль',
        summary:'Приложение — набор маленьких независимых сервисов, каждый со своей БД.',
        short:'Независимые сервисы по бизнес-доменам (bounded contexts). Каждый деплоится, масштабируется и разрабатывается отдельно.',
        medium:{
          theory:'Принципы: single responsibility на уровне сервиса, loose coupling, high cohesion. Database per Service — у каждого своя БД. Взаимодействие через API (sync) или события (async).',
          tradeoffs:'Плюс: независимый деплой, масштабирование, технологическая свобода. Минус: сетевые задержки, распределённые транзакции, операционная сложность.',
          code:`// Каждый сервис — отдельный процесс и БД:
Order Service   → POST /orders    → orders-db (Postgres)
Payment Service → POST /payments  → payments-db (Postgres)
User Service    → GET  /users/:id → users-db (MongoDB)

// Async взаимодействие через события:
order-created → [Kafka] → payment-service
                        → notification-service`
        },
        links:[
          {label:'Microservices — Fowler', url:'https://martinfowler.com/articles/microservices.html'},
          {label:'Microservices Patterns', url:'https://microservices.io/patterns/'}
        ],
        questions:['Как определить границы сервиса (bounded context)?','Как решать распределённые транзакции?','Что такое strangler fig pattern?']
      },
      {
        name:'Event-Driven', tag:'style', tagLabel:'Стиль',
        summary:'Компоненты общаются через события асинхронно. Слабая связанность, высокая масштабируемость.',
        short:'Продюсеры публикуют события, консьюмеры подписываются. Никто не знает о существовании других напрямую.',
        medium:{
          theory:'Паттерны: Event Notification (уведомление), Event-Carried State Transfer (событие несёт данные), Event Sourcing (события как источник истины). Брокеры: Kafka, RabbitMQ, NATS.',
          tradeoffs:'Плюс: слабая связность, масштабируемость, отказоустойчивость. Минус: eventual consistency, сложность отладки, гарантии порядка событий.',
          code:`// Producer (Order Service):
eventBus.publish('order.created', {
  orderId: '123',
  userId: 'u456',
  amount: 500,
  items: [...]
})

// Consumer (Payment Service):
eventBus.subscribe('order.created', async (event) => {
  await processPayment(event.orderId, event.amount)
})`
        },
        links:[
          {label:'Event-Driven — Fowler', url:'https://martinfowler.com/articles/201701-event-driven.html'},
          {label:'Apache Kafka docs', url:'https://kafka.apache.org/documentation/'}
        ],
        questions:['В чём разница между Event Notification и Event Sourcing?','Как обеспечить порядок обработки событий?','Что такое consumer group?']
      },
      {
        name:'Layered / Clean Architecture', tag:'style', tagLabel:'Стиль',
        summary:'Приложение делится на слои: Presentation → Application → Domain → Infrastructure.',
        short:'Классическая N-tier. В Clean Architecture зависимости направлены только внутрь — к Domain.',
        medium:{
          theory:'Слои: Presentation (UI/API), Application (use cases), Domain (бизнес-логика, entities), Infrastructure (БД, внешние API). Главное правило Clean Architecture: Domain не знает ни о чём внешнем.',
          tradeoffs:'Плюс: понятность, хорошая структура, тестируемость Domain без БД. Минус: много файлов, изменение сквозной функции затрагивает все слои.',
          code:`// Правило зависимостей — стрелки только внутрь:
Presentation → Application → Domain ← (нет зависимостей)
Infrastructure → Application → Domain

src/
  domain/         // entities, value objects, interfaces
  application/    // use cases (OrderService, CreateOrderUseCase)
  infrastructure/ // OrderRepository, EmailService (реализации)
  presentation/   // controllers, DTOs`
        },
        links:[{label:'Clean Architecture — Uncle Bob', url:'https://blog.cleancoder.com/uncle-bob/2012/08/13/the-clean-architecture.html'}],
        questions:['Чем Clean Architecture отличается от обычной layered?','Что такое Anti-Corruption Layer?','Зачем использовать интерфейсы в Domain?']
      }
    ]

    } catch (err) {
      if (attempt === maxAttempts) throw err
      if (err.status === 400) throw err // не ретраим клиентские ошибки
      const jitter = Math.random() * baseDelayMs
      const delay = baseDelayMs * Math.pow(2, attempt - 1) + jitter
      await sleep(delay) // 100ms, 200ms, 400ms + случайный сдвиг
    }
  }
}`

// STATE
let activeSection = 'all'
let expandedCard = null

// BUILD SIDEBAR
function buildSidebar() {
  const nav = document.getElementById('sidebarNav')
  const allBtn = document.createElement('button')
  allBtn.className = 'nav-item active'
  allBtn.dataset.section = 'all'
  const total = DATA.reduce((s, d) => s + d.topics.length, 0)
  allBtn.innerHTML = `<span class="icon">📚</span> Все разделы <span class="nav-badge">${total}</span>`
  allBtn.onclick = () => setSection('all')
  nav.appendChild(allBtn)

  DATA.forEach(sec => {
    const btn = document.createElement('button')
    btn.className = 'nav-item'
    btn.dataset.section = sec.id
    btn.innerHTML = `<span class="icon">${sec.icon}</span> ${sec.title} <span class="nav-badge">${sec.topics.length}</span>`
    btn.onclick = () => setSection(sec.id)
    nav.appendChild(btn)
  })
}

function setSection(id) {
  activeSection = id
  expandedCard = null
  document.querySelectorAll('.nav-item').forEach(b => {
    b.classList.toggle('active', b.dataset.section === id)
  })
  render()
}

// RENDER
function render() {
  const searchVal = document.getElementById('search').value.toLowerCase().trim()
  const main = document.getElementById('mainContent')
  main.innerHTML = ''
  let totalVisible = 0

  DATA.forEach(sec => {
    if (activeSection !== 'all' && sec.id !== activeSection) return

    const filtered = sec.topics.filter(t =>
      !searchVal ||
      t.name.toLowerCase().includes(searchVal) ||
      t.summary.toLowerCase().includes(searchVal) ||
      t.short.toLowerCase().includes(searchVal) ||
      (t.medium.theory && t.medium.theory.toLowerCase().includes(searchVal))
    )
    if (!filtered.length) return
    totalVisible += filtered.length

    const block = document.createElement('div')
    block.className = 'section-block'
    block.id = 'sec-' + sec.id

    const header = document.createElement('div')
    header.className = 'section-header'
    header.innerHTML = `
      <div class="section-icon" style="background:${sec.iconBg}">${sec.icon}</div>
      <span class="section-title">${sec.title}</span>
      <span class="section-count">${filtered.length} ${plural(filtered.length, 'тема','темы','тем')}</span>
    `
    block.appendChild(header)

    const grid = document.createElement('div')
    grid.className = 'topics-grid'
    filtered.forEach(t => grid.appendChild(buildCard(t)))
    block.appendChild(grid)
    main.appendChild(block)
  })

  if (!totalVisible) {
    main.innerHTML = '<div class="no-results">Ничего не найдено. Попробуй другой запрос.</div>'
  }
}

function plural(n, f1, f2, f5) {
  const v = Math.abs(n) % 100
  if (v >= 11 && v <= 19) return f5
  const v2 = v % 10
  if (v2 === 1) return f1
  if (v2 >= 2 && v2 <= 4) return f2
  return f5
}

function buildCard(topic) {
  const card = document.createElement('div')
  card.className = 'topic-card' + (expandedCard === topic.name ? ' expanded' : '')

  const tagCls = {
    pattern:'tag-pattern', style:'tag-style', principle:'tag-principle',
    infra:'tag-infra', security:'tag-security', scale:'tag-scale'
  }[topic.tag] || 'tag-pattern'

  card.innerHTML = `
    <div class="card-top">
      <span class="card-name">${topic.name}</span>
      <span class="card-tag ${tagCls}">${topic.tagLabel}</span>
    </div>
    <div class="card-summary">${topic.summary}</div>
    <div class="card-details">
      <div class="levels">
        <button class="level-btn ${expandedCard === topic.name ? 'lv1' : ''}" data-lv="1">🟡 Кратко</button>
        <button class="level-btn" data-lv="2">🟠 Подробнее</button>
        <button class="level-btn" data-lv="3">🔴 Глубоко</button>
      </div>
      <div class="level-content" data-panel="1">
        ${topic.short}
      </div>
      <div class="level-content" data-panel="2" style="display:none">
        <p>${topic.medium.theory}</p>
        <div class="tradeoffs">
          <div class="tradeoffs-label">Trade-offs</div>
          ${topic.medium.tradeoffs}
        </div>
        <pre class="code-block">${escHtml(topic.medium.code)}</pre>
      </div>
      <div class="level-content" data-panel="3" style="display:none">
        <div class="questions">
          <div class="questions-label">Вопросы для самопроверки</div>
          ${topic.questions.map(q => `<div class="q-item"><span class="q-arrow">→</span>${q}</div>`).join('')}
        </div>
        <div class="links-row">
          ${topic.links.map(l => `<a class="ext-link" href="${l.url}" target="_blank" rel="noopener">↗ ${l.label}</a>`).join('')}
        </div>
      </div>
    </div>
  `

  // Toggle expand
  card.addEventListener('click', e => {
    if (e.target.tagName === 'BUTTON' || e.target.tagName === 'A') return
    expandedCard = expandedCard === topic.name ? null : topic.name
    render()
  })

  // Level buttons
  card.querySelectorAll('.level-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation()
      const lv = btn.dataset.lv
      card.querySelectorAll('.level-btn').forEach(b => b.className = 'level-btn')
      btn.classList.add('lv' + lv)
      card.querySelectorAll('[data-panel]').forEach(p => {
        p.style.display = p.dataset.panel === lv ? 'block' : 'none'
      })
    })
  })

  return card
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

// INIT
buildSidebar()
render()

document.getElementById('search').addEventListener('input', () => {
  expandedCard = null
  render()
})
