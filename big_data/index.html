<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Big Data & Data Engineering — Справочник</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --bg-secondary: #f6f8fa;
    --bg-tertiary: #eef2f6;
    --text: #1a1f2e;
    --text-secondary: #52617a;
    --text-tertiary: #96a3b6;
    --border: rgba(0,0,0,0.09);
    --border-med: rgba(0,0,0,0.16);
    --accent: #2563eb;
    --accent-soft: #EEF3FE;
    --radius: 8px;
    --radius-lg: 12px;
    --font: 'Inter', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1117;
      --bg-secondary: #161b27;
      --bg-tertiary: #1e2536;
      --text: #e8edf5;
      --text-secondary: #8a96aa;
      --text-tertiary: #4a5568;
      --border: rgba(255,255,255,0.08);
      --border-med: rgba(255,255,255,0.15);
      --accent: #4d8ff5;
      --accent-soft: #0d1e3d;
    }
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    border-bottom: 0.5px solid var(--border);
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .header-logo {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }

  .header-titles h1 { font-size: 16px; font-weight: 600; }
  .header-titles p { font-size: 11px; color: var(--text-tertiary); margin-top: 1px; }

  .header-nav {
    display: flex; align-items: center; gap: 8px;
  }

  .breadcrumb {
    font-size: 12px; color: var(--text-tertiary);
    display: flex; align-items: center; gap: 4px;
  }
  .breadcrumb a { color: var(--text-tertiary); text-decoration: none; transition: color 0.15s; }
  .breadcrumb a:hover { color: var(--text-secondary); text-decoration: underline; }
  .breadcrumb span.sep { opacity: 0.5; }
  .breadcrumb span.current { color: var(--text-secondary); }

  .search-wrap {
    position: relative;
  }
  .search-wrap svg {
    position: absolute; left: 10px; top: 50%;
    transform: translateY(-50%);
    width: 13px; height: 13px;
    color: var(--text-tertiary); pointer-events: none;
  }
  .search-wrap input {
    padding: 7px 12px 7px 30px;
    font-size: 12px; font-family: var(--font);
    border: 0.5px solid var(--border-med);
    border-radius: 20px;
    background: var(--bg-secondary);
    color: var(--text); outline: none; width: 220px;
    transition: border-color 0.15s, width 0.2s;
  }
  .search-wrap input:focus { border-color: var(--accent); width: 260px; }
  .search-wrap input::placeholder { color: var(--text-tertiary); }

  /* LAYOUT */
  .layout { display: flex; min-height: calc(100vh - 57px); }

  /* SIDEBAR */
  .sidebar {
    width: 210px; flex-shrink: 0;
    border-right: 0.5px solid var(--border);
    padding: 1.25rem 0;
    position: sticky; top: 57px;
    height: calc(100vh - 57px);
    overflow-y: auto;
  }

  .sidebar-section { margin-bottom: 1.25rem; }
  .sidebar-label {
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-tertiary);
    padding: 0 1rem 6px;
  }

  .nav-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 1rem;
    font-size: 13px; color: var(--text-secondary);
    cursor: pointer; border: none; background: none;
    width: 100%; text-align: left;
    transition: all 0.12s;
  }
  .nav-item:hover { color: var(--text); background: var(--bg-secondary); }
  .nav-item.active {
    color: var(--accent); background: var(--accent-soft);
    font-weight: 500;
    border-right: 2px solid var(--accent);
  }
  .nav-item .ni { font-size: 14px; width: 18px; text-align: center; flex-shrink: 0; }
  .nav-badge {
    margin-left: auto; font-size: 10px;
    color: var(--text-tertiary);
    background: var(--bg-tertiary);
    padding: 1px 6px; border-radius: 10px;
  }

  /* MAIN */
  .main { flex: 1; padding: 2rem; max-width: 960px; }

  /* SECTION */
  .section-block { margin-bottom: 2.5rem; scroll-margin-top: 80px; }

  .section-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 1.25rem;
    padding-bottom: 10px;
    border-bottom: 0.5px solid var(--border);
  }
  .section-icon {
    width: 32px; height: 32px; border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .section-meta { flex: 1; }
  .section-title { font-size: 15px; font-weight: 600; }
  .section-desc { font-size: 12px; color: var(--text-tertiary); margin-top: 1px; }
  .section-count { font-size: 11px; color: var(--text-tertiary); white-space: nowrap; }

  .topics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 10px;
  }

  /* CARD */
  .topic-card {
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1rem 1.125rem;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .topic-card:hover { border-color: var(--border-med); }
  .topic-card.expanded { border-color: var(--accent); }

  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .card-name { font-size: 14px; font-weight: 500; line-height: 1.3; }
  .card-tag {
    font-size: 10px; padding: 2px 7px;
    border-radius: 10px; flex-shrink: 0;
    margin-top: 2px; font-weight: 500;
  }

  .tag-arch     { background:#EEF3FE; color:#1e4db7; }
  .tag-process  { background:#E8F5E9; color:#1b5e20; }
  .tag-storage  { background:#FFF8E1; color:#5d3f00; }
  .tag-pattern  { background:#F3E8FF; color:#5b21b6; }
  .tag-concept  { background:#FEE2E2; color:#991b1b; }
  .tag-pipeline { background:#E0F2FE; color:#0c4a6e; }

  @media (prefers-color-scheme: dark) {
    .tag-arch     { background:#0d1e3d; color:#7aadfa; }
    .tag-process  { background:#052e16; color:#86efac; }
    .tag-storage  { background:#2d1f00; color:#fcd34d; }
    .tag-pattern  { background:#2e1065; color:#c4b5fd; }
    .tag-concept  { background:#450a0a; color:#fca5a5; }
    .tag-pipeline { background:#082f49; color:#7dd3fc; }
  }

  .card-summary { font-size: 12px; color: var(--text-secondary); margin-top: 6px; line-height: 1.5; }

  .card-details {
    display: none; margin-top: 12px;
    border-top: 0.5px solid var(--border);
    padding-top: 12px;
  }
  .topic-card.expanded .card-details { display: block; }

  /* LEVEL TABS */
  .levels { display: flex; gap: 5px; margin-bottom: 12px; }
  .level-btn {
    font-size: 11px; padding: 4px 10px;
    border: 0.5px solid var(--border);
    border-radius: 20px; background: transparent;
    color: var(--text-secondary); cursor: pointer;
    font-family: var(--font); transition: all 0.12s;
  }
  .level-btn:hover { border-color: var(--border-med); color: var(--text); }
  .level-btn.lv1 { background:#FFF8E1; color:#92400e; border-color:#fbbf24; }
  .level-btn.lv2 { background:#FEF3C7; color:#78350f; border-color:#f59e0b; }
  .level-btn.lv3 { background:#FEE2E2; color:#7f1d1d; border-color:#f87171; }
  @media (prefers-color-scheme: dark) {
    .level-btn.lv1 { background:#2d1f00; color:#fcd34d; border-color:#92400e; }
    .level-btn.lv2 { background:#3b1f00; color:#fbbf24; border-color:#78350f; }
    .level-btn.lv3 { background:#450a0a; color:#fca5a5; border-color:#7f1d1d; }
  }

  .level-content { font-size: 13px; color: var(--text); line-height: 1.65; }

  .tradeoffs {
    margin-top: 10px; padding: 10px 12px;
    background: var(--bg-secondary);
    border-radius: var(--radius);
    font-size: 12px; color: var(--text-secondary);
    border-left: 2px solid var(--border-med);
  }
  .tradeoffs-label {
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-tertiary); margin-bottom: 4px;
  }

  .tools-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .tool-chip {
    font-size: 11px; padding: 3px 8px;
    background: var(--bg-tertiary);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-secondary);
    font-family: var(--font-mono);
  }

  .code-block {
    margin-top: 10px;
    background: var(--bg-secondary);
    border-radius: var(--radius);
    padding: 10px 12px;
    font-family: var(--font-mono);
    font-size: 11.5px; color: var(--text);
    line-height: 1.65; white-space: pre;
    overflow-x: auto;
    border: 0.5px solid var(--border);
  }

  .questions { margin-top: 10px; }
  .questions-label {
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-tertiary); margin-bottom: 6px;
  }
  .q-item {
    font-size: 12px; color: var(--text-secondary);
    padding: 5px 0; border-bottom: 0.5px solid var(--border);
    line-height: 1.45; display: flex; gap: 6px;
  }
  .q-item:last-child { border-bottom: none; }
  .q-arrow { color: var(--text-tertiary); flex-shrink: 0; }

  .links-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .ext-link {
    font-size: 11px; padding: 4px 10px;
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    color: var(--accent); text-decoration: none;
    background: var(--bg); transition: background 0.12s;
  }
  .ext-link:hover { background: var(--bg-secondary); }

  .diagram {
    margin-top: 10px;
    background: var(--bg-secondary);
    border-radius: var(--radius);
    padding: 12px 14px;
    font-family: var(--font-mono);
    font-size: 11px; color: var(--text-secondary);
    line-height: 1.8; white-space: pre;
    border: 0.5px solid var(--border);
    overflow-x: auto;
  }

  .no-results {
    text-align: center; padding: 3rem;
    color: var(--text-tertiary); font-size: 14px;
  }

  @media (max-width: 640px) {
    .sidebar { display: none; }
    .header { padding: 0.875rem 1rem; }
    .main { padding: 1rem; }
    .topics-grid { grid-template-columns: 1fr; }
    .search-wrap input { width: 160px; }
  }
</style>
</head>

// STATE
let activeSection = 'all'
let expandedCard = null

// SIDEBAR
function buildSidebar() {
  const nav = document.getElementById('sidebarNav')
  const total = DATA.reduce((s, d) => s + d.topics.length, 0)

  const allBtn = document.createElement('button')
  allBtn.className = 'nav-item active'
  allBtn.dataset.section = 'all'
  allBtn.innerHTML = `<span class="ni">📚</span> Все паттерны <span class="nav-badge">${total}</span>`
  allBtn.onclick = () => setSection('all')
  nav.appendChild(allBtn)

  DATA.forEach(sec => {
    const btn = document.createElement('button')
    btn.className = 'nav-item'
    btn.dataset.section = sec.id
    btn.innerHTML = `<span class="ni">${sec.icon}</span> ${sec.title} <span class="nav-badge">${sec.topics.length}</span>`
    btn.onclick = () => setSection(sec.id)
    nav.appendChild(btn)
  })
}

function setSection(id) {
  activeSection = id
  expandedCard = null
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.section === id))
  render()
}

// RENDER
function render() {
  const q = document.getElementById('search').value.toLowerCase().trim()
  const main = document.getElementById('mainContent')
  main.innerHTML = ''
  let total = 0

  DATA.forEach(sec => {
    if (activeSection !== 'all' && sec.id !== activeSection) return
    const filtered = sec.topics.filter(t =>
      !q ||
      t.name.toLowerCase().includes(q) ||
      t.summary.toLowerCase().includes(q) ||
      t.short.toLowerCase().includes(q) ||
      (t.tools && t.tools.some(tool => tool.toLowerCase().includes(q)))
    )
    if (!filtered.length) return
    total += filtered.length

    const block = document.createElement('div')
    block.className = 'section-block'

    block.innerHTML = `
      <div class="section-header">
        <div class="section-icon" style="background:${sec.iconBg}">${sec.icon}</div>
        <div class="section-meta">
          <div class="section-title">${sec.title}</div>
          <div class="section-desc">${sec.desc}</div>
        </div>
        <span class="section-count">${filtered.length} ${plural(filtered.length,'паттерн','паттерна','паттернов')}</span>
      </div>
      <div class="topics-grid" id="grid-${sec.id}"></div>
    `
    main.appendChild(block)

    const grid = block.querySelector(`#grid-${sec.id}`)
    filtered.forEach(t => grid.appendChild(buildCard(t)))
  })

  if (!total) {
    main.innerHTML = '<div class="no-results">Ничего не найдено. Попробуй другой запрос.</div>'
  }
}

function buildCard(topic) {
  const card = document.createElement('div')
  card.className = 'topic-card' + (expandedCard === topic.name ? ' expanded' : '')

  const tagCls = {
    arch:'tag-arch', process:'tag-process', storage:'tag-storage',
    pattern:'tag-pattern', concept:'tag-concept', pipeline:'tag-pipeline'
  }[topic.tag] || 'tag-arch'

  card.innerHTML = `
    <div class="card-top">
      <span class="card-name">${topic.name}</span>
      <span class="card-tag ${tagCls}">${topic.tagLabel}</span>
    </div>
    <div class="card-summary">${topic.summary}</div>
    <div class="card-details">
      <div class="levels">
        <button class="level-btn ${expandedCard === topic.name ? 'lv1' : ''}" data-lv="1">🟡 Кратко</button>
        <button class="level-btn" data-lv="2">🟠 Подробнее</button>
        <button class="level-btn" data-lv="3">🔴 Глубоко</button>
      </div>
      <div class="level-content" data-panel="1">${topic.short}</div>
      <div class="level-content" data-panel="2" style="display:none">
        <p>${topic.medium.theory}</p>
        <div class="tradeoffs">
          <div class="tradeoffs-label">Trade-offs</div>
          ${topic.medium.tradeoffs}
        </div>
        <pre class="diagram">${escHtml(topic.medium.code)}</pre>
        <div class="tools-row">
          ${(topic.tools || []).map(t => `<span class="tool-chip">${t}</span>`).join('')}
        </div>
      </div>
      <div class="level-content" data-panel="3" style="display:none">
        <div class="questions">
          <div class="questions-label">Вопросы для самопроверки</div>
          ${topic.questions.map(q => `<div class="q-item"><span class="q-arrow">→</span>${q}</div>`).join('')}
        </div>
        <div class="links-row">
          ${topic.links.map(l => `<a class="ext-link" href="${l.url}" target="_blank" rel="noopener">↗ ${l.label}</a>`).join('')}
        </div>
      </div>
    </div>
  `

  card.addEventListener('click', e => {
    if (e.target.tagName === 'BUTTON' || e.target.tagName === 'A') return
    expandedCard = expandedCard === topic.name ? null : topic.name
    render()
  })

  card.querySelectorAll('.level-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation()
      const lv = btn.dataset.lv
      card.querySelectorAll('.level-btn').forEach(b => b.className = 'level-btn')
      btn.classList.add('lv' + lv)
      card.querySelectorAll('[data-panel]').forEach(p => {
        p.style.display = p.dataset.panel === lv ? 'block' : 'none'
      })
    })
  })

  return card
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
}

function plural(n, f1, f2, f5) {
  const v = Math.abs(n) % 100
  if (v >= 11 && v <= 19) return f5
  const v2 = v % 10
  if (v2 === 1) return f1
  if (v2 >= 2 && v2 <= 4) return f2
  return f5
}

buildSidebar()
render()

document.getElementById('search').addEventListener('input', () => {
  expandedCard = null; render()
})
</script>
