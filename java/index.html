<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java — Справочник</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --bg-secondary: #f7f6f3;
    --bg-tertiary: #f0efe9;
    --text: #1a1a18;
    --text-secondary: #5a5a55;
    --text-tertiary: #9a9a92;
    --border: rgba(0,0,0,0.1);
    --border-med: rgba(0,0,0,0.18);
    --radius: 8px;
    --radius-lg: 12px;
    --font: 'Inter', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a18;
      --bg-secondary: #242420;
      --bg-tertiary: #2c2c28;
      --text: #f0efe9;
      --text-secondary: #a0a098;
      --text-tertiary: #606058;
      --border: rgba(255,255,255,0.1);
      --border-med: rgba(255,255,255,0.18);
    }
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    border-bottom: 0.5px solid var(--border);
    padding: 1.25rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
    backdrop-filter: blur(8px);
  }
  .header-left h1 { font-size: 17px; font-weight: 600; color: var(--text); }
  .header-left p { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }

  .breadcrumb {
    display: flex; align-items: center; gap: 5px;
    font-size: 12px; color: var(--text-tertiary);
  }
  .breadcrumb a {
    color: var(--text-tertiary); text-decoration: none;
    transition: color 0.15s;
  }
  .breadcrumb a:hover { color: var(--text-secondary); text-decoration: underline; }
  .breadcrumb span.sep { color: var(--text-tertiary); opacity: 0.5; }
  .breadcrumb span.current { color: var(--text-secondary); }

  .search-wrap {
    position: relative;
    flex: 1;
    max-width: 280px;
  }
  .search-wrap svg {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px; height: 14px;
    color: var(--text-tertiary);
    pointer-events: none;
  }
  .search-wrap input {
    width: 100%;
    padding: 8px 12px 8px 32px;
    font-size: 13px;
    font-family: var(--font);
    border: 0.5px solid var(--border-med);
    border-radius: 20px;
    background: var(--bg-secondary);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  .search-wrap input:focus { border-color: #7f77dd; }
  .search-wrap input::placeholder { color: var(--text-tertiary); }

  /* LAYOUT */
  .layout { display: flex; min-height: calc(100vh - 64px); }

  /* SIDEBAR */
  .sidebar {
    width: 200px;
    flex-shrink: 0;
    border-right: 0.5px solid var(--border);
    padding: 1.25rem 0;
    position: sticky;
    top: 64px;
    height: calc(100vh - 64px);
    overflow-y: auto;
  }
  .sidebar-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-tertiary);
    padding: 0 1rem 8px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 1rem;
    font-size: 13px;
    color: var(--text-secondary);
    cursor: pointer;
    border-radius: 0;
    transition: all 0.12s;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
  }
  .nav-item:hover { color: var(--text); background: var(--bg-secondary); }
  .nav-item.active {
    color: var(--text);
    background: var(--bg-tertiary);
    font-weight: 500;
    border-right: 2px solid #7f77dd;
  }
  .nav-item .icon { font-size: 14px; width: 18px; text-align: center; }
  .nav-badge {
    margin-left: auto;
    font-size: 10px;
    color: var(--text-tertiary);
    background: var(--bg-tertiary);
    padding: 1px 6px;
    border-radius: 10px;
  }

  /* MAIN */
  .main { flex: 1; padding: 2rem; max-width: 900px; }

  /* SECTION */
  .section-block { margin-bottom: 2.5rem; }
  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 1rem;
    padding-bottom: 10px;
    border-bottom: 0.5px solid var(--border);
  }
  .section-icon {
    width: 30px; height: 30px;
    border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; flex-shrink: 0;
  }
  .section-title { font-size: 15px; font-weight: 600; color: var(--text); }
  .section-count { margin-left: auto; font-size: 12px; color: var(--text-tertiary); }

  .topics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 10px;
  }

  /* CARD */
  .topic-card {
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1rem 1.125rem;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .topic-card:hover { border-color: var(--border-med); }
  .topic-card.expanded { border-color: #7f77dd; }

  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .card-name { font-size: 14px; font-weight: 500; color: var(--text); line-height: 1.3; }
  .card-tag {
    font-size: 10px; padding: 2px 7px;
    border-radius: 10px; flex-shrink: 0; margin-top: 2px; font-weight: 500;
  }
  .tag-jvm      { background: #EEEDFE; color: #3C3489; }
  .tag-threads  { background: #E1F5EE; color: #085041; }
  .tag-spring   { background: #EAF3DE; color: #27500A; }
  .tag-design   { background: #FAEEDA; color: #633806; }

  @media (prefers-color-scheme: dark) {
    .tag-jvm     { background: #26215C; color: #CECBF6; }
    .tag-threads { background: #04342C; color: #9FE1CB; }
    .tag-spring  { background: #173404; color: #C0DD97; }
    .tag-design  { background: #412402; color: #FAC775; }
  }

  .card-summary { font-size: 12px; color: var(--text-secondary); margin-top: 6px; line-height: 1.5; }

  .card-details {
    display: none;
    margin-top: 12px;
    border-top: 0.5px solid var(--border);
    padding-top: 12px;
  }
  .topic-card.expanded .card-details { display: block; }

  /* LEVELS */
  .levels { display: flex; gap: 5px; margin-bottom: 12px; flex-wrap: wrap; }
  .level-btn {
    font-size: 11px; padding: 4px 10px;
    border: 0.5px solid var(--border);
    border-radius: 20px;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    font-family: var(--font);
    transition: all 0.12s;
  }
  .level-btn:hover { border-color: var(--border-med); color: var(--text); }
  .level-btn.lv1 { background: #FAEEDA; color: #633806; border-color: #FAC775; }
  .level-btn.lv2 { background: #FAECE7; color: #712B13; border-color: #F0997B; }
  .level-btn.lv3 { background: #FCEBEB; color: #791F1F; border-color: #F09595; }
  @media (prefers-color-scheme: dark) {
    .level-btn.lv1 { background: #412402; color: #FAC775; border-color: #633806; }
    .level-btn.lv2 { background: #4A1B0C; color: #F5C4B3; border-color: #712B13; }
    .level-btn.lv3 { background: #501313; color: #F7C1C1; border-color: #791F1F; }
  }

  .level-content { font-size: 13px; color: var(--text); line-height: 1.65; }

  .tradeoffs {
    margin-top: 10px; padding: 8px 10px;
    background: var(--bg-secondary);
    border-radius: var(--radius);
    font-size: 12px;
    color: var(--text-secondary);
  }
  .tradeoffs-label {
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-tertiary); margin-bottom: 4px;
  }

  .code-block {
    margin-top: 10px;
    background: var(--bg-secondary);
    border-radius: var(--radius);
    padding: 10px 12px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--text);
    line-height: 1.65;
    white-space: pre;
    overflow-x: auto;
    border: 0.5px solid var(--border);
  }

  .questions { margin-top: 10px; }
  .questions-label {
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-tertiary); margin-bottom: 6px;
  }
  .q-item {
    font-size: 12px; color: var(--text-secondary);
    padding: 5px 0;
    border-bottom: 0.5px solid var(--border);
    line-height: 1.45;
    display: flex; gap: 6px;
  }
  .q-item:last-child { border-bottom: none; }
  .q-arrow { color: var(--text-tertiary); flex-shrink: 0; }

  .links-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .ext-link {
    font-size: 11px; padding: 4px 10px;
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    color: #185FA5;
    text-decoration: none;
    background: var(--bg);
    transition: background 0.12s;
  }
  .ext-link:hover { background: var(--bg-secondary); }
  @media (prefers-color-scheme: dark) { .ext-link { color: #85B7EB; } }

  .no-results {
    text-align: center; padding: 3rem;
    color: var(--text-tertiary); font-size: 14px;
  }

  /* RESPONSIVE */
  @media (max-width: 640px) {
    .sidebar { display: none; }
    .header { padding: 1rem; }
    .main { padding: 1rem; }
    .topics-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <nav class="breadcrumb" aria-label="Навигация">
      <a href="../">doca</a>
      <span class="sep">/</span>
      <span class="current">Java</span>
    </nav>
    <h1>Senior Java Developer</h1>
    <p>Личный справочник · 7 тем · 3 уровня глубины</p>
  </div>
  <div class="search-wrap">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <circle cx="6.5" cy="6.5" r="4"/>
      <path d="M11 11l2.5 2.5"/>
    </svg>
    <input type="text" id="search" placeholder="Поиск..." aria-label="Поиск по справочнику">
  </div>
</header>

<div class="layout">
  <nav class="sidebar" aria-label="Разделы справочника">
    <div class="sidebar-label">Разделы</div>
    <div id="sidebarNav"></div>
  </nav>
  <main class="main" id="mainContent"></main>
</div>

<script>
const DATA = [
  {
    id:'jvm', title:'JVM и память', icon:'🧠', iconBg:'#FFF3E0',
    topics:[
      {
        name:'G1GC vs ZGC', tag:'jvm', tagLabel:'JVM',
        summary:'Два современных сборщика мусора: G1 — баланс throughput и пауз, ZGC — субмиллисекундные паузы.',
        short:'G1GC делит кучу на равные регионы и собирает их параллельно и инкрементально, целясь в заданный pause time. ZGC — low-latency коллектор для куч от мегабайт до терабайт с паузами стабильно ниже 1 мс (colored pointers + load barriers).',
        medium:{
          theory:'G1 разбивает heap на регионы (Eden/Survivor/Old), собирает их по приоритету "garbage-first" и ориентируется на -XX:MaxGCPauseMillis. ZGC использует colored pointers (метаданные в указателе) и load barriers, позволяя потокам приложения работать одновременно со сборкой — почти вся работа GC конкурентна.',
          tradeoffs:'G1: предсказуемый throughput, хорош до ~десятков ГБ. ZGC: минимальные паузы независимо от размера кучи, но чуть ниже throughput и больше памяти на overhead (forwarding tables). Для больших heap с жёсткими требованиями к latency — ZGC или Generational ZGC (JDK 21+).',
          code:`# G1 — цели по паузам:
java -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -Xms4g -Xmx4g -jar app.jar

# ZGC — субмиллисекундные паузы:
java -XX:+UseZGC -XX:+ZGenerational -Xmx16g -jar app.jar

# Диагностика пауз:
java -XX:+UseZGC -Xlog:gc*:file=gc.log:time,uptime -jar app.jar`
        },
        links:[
          {label:'ZGC — OpenJDK', url:'https://openjdk.org/jeps/333'},
          {label:'G1 Garbage-First', url:'https://www.oracle.com/technical-resources/articles/java/g1gc.html'}
        ],
        questions:['Как работает colored pointers в ZGC?','Что такое remembered set в G1?','Когда выбирать Parallel GC вместо G1?','Что изменил Generational ZGC?']
      },
      {
        name:'Metaspace vs PermGen', tag:'jvm', tagLabel:'JVM',
        summary:'PermGen был частью heap с фиксированным лимитом; Metaspace живёт в native memory и растёт динамически.',
        short:'PermGen (до Java 7) — часть Java Heap фиксированного размера, источник OutOfMemoryError: PermGen space. Metaspace (Java 8+) находится в нативной памяти и расширяется динамически, если не ограничен -XX:MaxMetaspaceSize.',
        medium:{
          theory:'Metaspace хранит метаданные классов, методы, constant pool. Память выделяется из native heap; при выгрузке классов метаданные освобождаются. String table и static-поля переехали в обычный heap. Ограничение: -XX:MaxMetaspaceSize, иначе metaspace может расти до исчерпания памяти машины.',
          tradeoffs:'Плюс Metaspace: нет жёсткого лимита по умолчанию, меньше OOM при динамической генерации классов (CGLIB, Groovy, hot reload). Минус: утечки классов (classloader leaks) незаметно съедают нативную память — нужен мониторинг и лимит в production.',
          code:`# Ограничение Metaspace в production:
java -XX:MetaspaceSize=256m -XX:MaxMetaspaceSize=512m -jar app.jar

# Типичная причина утечки — повторяющаяся генерация классов:
for (int i = 0; i < 100_000; i++) {
    Enhancer enhancer = new Enhancer();      // CGLIB
    enhancer.setSuperclass(Foo.class);
    enhancer.setUseCache(false);             // ← кэш выключен,
    enhancer.create();                       //    каждый вызов = новый класс
}
// java.lang.OutOfMemoryError: Metaspace`
        },
        links:[
          {label:'JEP 122: Remove Permanent Generation', url:'https://openjdk.org/jeps/122'},
          {label:'Metaspace in Java 8', url:'https://www.infoq.com/articles/Java-PermGen-Where-Art-Thou/'}
        ],
        questions:['Что хранится в Metaspace?','Почему утечка classloader приводит к OOM: Metaspace?','Как диагностировать рост Metaspace?']
      }
    ]
  },
  {
    id:'concurrency', title:'Многопоточность', icon:'🧵', iconBg:'#E8F5E9',
    topics:[
      {
        name:'synchronized vs ReentrantLock', tag:'threads', tagLabel:'Потоки',
        summary:'Intrinsic lock от JVM против явного Lock из java.util.concurrent с расширенными возможностями.',
        short:'synchronized — ключевое слово, монитором управляет JVM, блокировка освобождается автоматически при выходе из блока или исключении. ReentrantLock — класс из java.util.concurrent.locks: явные lock/unlock, try-lock с таймаутом, прерываемые блокировки, fairness policy.',
        medium:{
          theory:'ReentrantLock поддерживает tryLock() (без ожидания), tryLock(timeout), lockInterruptibly(), несколько Condition-очередей на одну блокировку и fair-режим. Цена — обязанность освобождать в finally. synchronized проще и с JDK 6 почти не уступает по производительности (biased/thin locks, lock coarsening).',
          tradeoffs:'synchronized: меньше ошибок (автоматическое освобождение), но нет таймаутов и прерываний. ReentrantLock: контроль и гибкость, но забытый unlock в finally = deadlock. Правило: synchronized по умолчанию, ReentrantLock когда нужны tryLock/conditions/fairness.',
          code:`// synchronized — JVM освободит блокировку сама:
synchronized (monitor) {
    counter++;
} // unlock даже при исключении

// ReentrantLock — unlock обязателен в finally:
private final ReentrantLock lock = new ReentrantLock(true); // fair

if (lock.tryLock(100, TimeUnit.MILLISECONDS)) {
    try {
        counter++;
    } finally {
        lock.unlock();
    }
} else {
    // не дождались блокировки — альтернативный путь
}`
        },
        links:[
          {label:'ReentrantLock — Javadoc', url:'https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/locks/ReentrantLock.html'},
          {label:'Java Concurrency in Practice', url:'https://jcip.net/'}
        ],
        questions:['Что будет, если не вызвать unlock в finally?','Зачем нужен fair lock и чем он дороже?','Как Condition отличается от wait/notify?']
      },
      {
        name:'Virtual Threads (Project Loom)', tag:'threads', tagLabel:'Потоки',
        summary:'Лёгкие потоки под управлением JVM: миллионы одновременных задач при ничтожном потреблении памяти.',
        short:'Platform threads — обёртки 1:1 над потоками ОС, дорогие по памяти и контекст-переключениям. Virtual threads управляются самой JVM (M:N scheduling) — миллионы потоков на несколько carrier-потоков ОС.',
        medium:{
          theory:'Virtual thread монтируется на carrier thread (ForkJoinPool). При блокирующем вызове (I/O, sleep) JVM снимает поток с carrier и паркует его стек в heap — carrier продолжает обслуживать другие virtual threads. Идеальны для thread-per-request I/O-нагрузки. Ограничения: pinning в synchronized-блоках и native-вызовах (лечится ReentrantLock), не ускоряют CPU-bound задачи.',
          tradeoffs:'Плюс: огромная масштабируемость I/O без реактивного стека, код остаётся последовательным и простым. Минус: пулинг virtual threads — антипаттерн, ThreadLocal может съесть память при миллионах потоков (используй Scoped Values), нужна дисциплина с семафорами вместо пулов.',
          code:`// Один virtual thread на запрос — блокирующий код без проблем:
try (var executor = Executors.newVirtualThreadPerTaskExecutor()) {
    IntStream.range(0, 100_000).forEach(i ->
        executor.submit(() -> {
            Thread.sleep(Duration.ofSeconds(1)); // не блокирует OS-поток
            return fetchUrl(i);
        })
    );
}

// Простой запуск:
Thread.startVirtualThread(() -> handle(request));

// HTTP-клиент на virtual threads:
var client = HttpClient.newHttpClient();`
        },
        links:[
          {label:'JEP 444: Virtual Threads', url:'https://openjdk.org/jeps/444'},
          {label:'State of Loom', url:'https://cr.openjdk.org/~rpressler/loom/loom/sol1_part1.html'}
        ],
        questions:['Что такое pinning virtual thread и как его избежать?','Почему нельзя пулить virtual threads?','Чем virtual threads лучше reactive для I/O?']
      }
    ]
  },
  {
    id:'spring', title:'Spring и микросервисы', icon:'🍃', iconBg:'#E3F2FD',
    topics:[
      {
        name:'Циклические зависимости в Spring', tag:'spring', tagLabel:'Spring',
        summary:'Setter/field injection Spring решает через трёхуровневый кэш; constructor injection — только через @Lazy или рефакторинг.',
        short:'Spring разрешает циклы для setter и field injection с помощью three-level cache (singletonFactories, earlySingletonObjects, singletonObjects). Цикл на конструкторах автоматически не решается — нужен @Lazy или архитектурный рефакторинг.',
        medium:{
          theory:'При создании бина Spring кладёт ObjectFactory в singletonFactories до полной инициализации, поэтому второй бин может получить раннюю ссылку. Для конструкторов это невозможно — объект ещё не создан, Spring бросает BeanCurrentlyInCreationException. @Lazy на конструкторе внедряет прокси, который резолвит настоящий бин при первом обращении. С Spring Boot 2.6 циклы по умолчанию запрещены.',
          tradeoffs:'@Lazy лечит симптом, но скрывает проблему дизайна: цикл = высокая связанность. Лучшие решения — объединить бины, вынести общую логику в третий сервис, использовать setter injection осознанно или событийную модель (ApplicationEventPublisher).',
          code:`// BeanCurrentlyInCreationException — цикл на конструкторах:
@Service
class A { A(B b) { ... } }
@Service
class B { B(A a) { ... } }

// Обход через @Lazy — внедряется прокси:
@Service
class A {
    A(@Lazy B b) { this.b = b; }
}

// Правильное решение — разорвать цикл:
@Service
class A { void doWork(ApplicationEventPublisher pub) {
    pub.publishEvent(new WorkDone());   // B слушает событие
} }`
        },
        links:[
          {label:'Circular References — Spring Docs', url:'https://docs.spring.io/spring-framework/reference/core/beans/factory-collab.html'}
        ],

        short:'Saga разбивает распределённую транзакцию на последовательность локальных. Каждый шаг обновляет свою БД и публикует событие/сообщение, запускающее следующий. При сбое шага выполняются компенсирующие транзакции, откатывающие изменения.',

public class CreateOrderSaga {

// STATE
let activeSection = 'all'
let expandedCard = null

// BUILD SIDEBAR
function buildSidebar() {
  const nav = document.getElementById('sidebarNav')
  const allBtn = document.createElement('button')
  allBtn.className = 'nav-item active'
  allBtn.dataset.section = 'all'
  const total = DATA.reduce((s, d) => s + d.topics.length, 0)
  allBtn.innerHTML = `<span class="icon">📚</span> Все разделы <span class="nav-badge">${total}</span>`
  allBtn.onclick = () => setSection('all')
  nav.appendChild(allBtn)

  DATA.forEach(sec => {
    const btn = document.createElement('button')
    btn.className = 'nav-item'
    btn.dataset.section = sec.id
    btn.innerHTML = `<span class="icon">${sec.icon}</span> ${sec.title} <span class="nav-badge">${sec.topics.length}</span>`
    btn.onclick = () => setSection(sec.id)
    nav.appendChild(btn)
  })
}

function setSection(id) {
  activeSection = id
  expandedCard = null
  document.querySelectorAll('.nav-item').forEach(b => {
    b.classList.toggle('active', b.dataset.section === id)
  })
  render()
}

// RENDER
function render() {
  const searchVal = document.getElementById('search').value.toLowerCase().trim()
  const main = document.getElementById('mainContent')
  main.innerHTML = ''
  let totalVisible = 0

  DATA.forEach(sec => {
    if (activeSection !== 'all' && sec.id !== activeSection) return

    const filtered = sec.topics.filter(t =>
      !searchVal ||
      t.name.toLowerCase().includes(searchVal) ||
      t.summary.toLowerCase().includes(searchVal) ||
      t.short.toLowerCase().includes(searchVal) ||
      (t.medium.theory && t.medium.theory.toLowerCase().includes(searchVal))
    )
    if (!filtered.length) return
    totalVisible += filtered.length

    const block = document.createElement('div')
    block.className = 'section-block'
    block.id = 'sec-' + sec.id

    const header = document.createElement('div')
    header.className = 'section-header'
    header.innerHTML = `
      <div class="section-icon" style="background:${sec.iconBg}">${sec.icon}</div>
      <span class="section-title">${sec.title}</span>
      <span class="section-count">${filtered.length} ${plural(filtered.length, 'тема','темы','тем')}</span>
    `
    block.appendChild(header)

    const grid = document.createElement('div')
    grid.className = 'topics-grid'
    filtered.forEach(t => grid.appendChild(buildCard(t)))
    block.appendChild(grid)
    main.appendChild(block)
  })

  if (!totalVisible) {
    main.innerHTML = '<div class="no-results">Ничего не найдено. Попробуй другой запрос.</div>'
  }
}

function plural(n, f1, f2, f5) {
  const v = Math.abs(n) % 100
  if (v >= 11 && v <= 19) return f5
  const v2 = v % 10
  if (v2 === 1) return f1
  if (v2 >= 2 && v2 <= 4) return f2
  return f5
}

function buildCard(topic) {
  const card = document.createElement('div')
  card.className = 'topic-card' + (expandedCard === topic.name ? ' expanded' : '')

  const tagCls = {
    jvm:'tag-jvm', threads:'tag-threads', spring:'tag-spring', design:'tag-design'
  }[topic.tag] || 'tag-jvm'

  card.innerHTML = `
    <div class="card-top">
      <span class="card-name">${topic.name}</span>
      <span class="card-tag ${tagCls}">${topic.tagLabel}</span>
    </div>
    <div class="card-summary">${topic.summary}</div>
    <div class="card-details">
      <div class="levels">
        <button class="level-btn ${expandedCard === topic.name ? 'lv1' : ''}" data-lv="1">🟡 Кратко</button>
        <button class="level-btn" data-lv="2">🟠 Подробнее</button>
        <button class="level-btn" data-lv="3">🔴 Глубоко</button>
      </div>
      <div class="level-content" data-panel="1">
        ${topic.short}
      </div>
      <div class="level-content" data-panel="2" style="display:none">
        <p>${topic.medium.theory}</p>
        <div class="tradeoffs">
          <div class="tradeoffs-label">Trade-offs</div>
          ${topic.medium.tradeoffs}
        </div>
        <pre class="code-block">${escHtml(topic.medium.code)}</pre>
      </div>
      <div class="level-content" data-panel="3" style="display:none">
        <div class="questions">
          <div class="questions-label">Вопросы для самопроверки</div>
          ${topic.questions.map(q => `<div class="q-item"><span class="q-arrow">→</span>${q}</div>`).join('')}
        </div>
        <div class="links-row">
          ${topic.links.map(l => `<a class="ext-link" href="${l.url}" target="_blank" rel="noopener">↗ ${l.label}</a>`).join('')}
        </div>
      </div>
    </div>
  `

  // Toggle expand
  card.addEventListener('click', e => {
    if (e.target.tagName === 'BUTTON' || e.target.tagName === 'A') return
    expandedCard = expandedCard === topic.name ? null : topic.name
    render()
  })

  // Level buttons
  card.querySelectorAll('.level-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation()
      const lv = btn.dataset.lv
      card.querySelectorAll('.level-btn').forEach(b => b.className = 'level-btn')
      btn.classList.add('lv' + lv)
      card.querySelectorAll('[data-panel]').forEach(p => {
        p.style.display = p.dataset.panel === lv ? 'block' : 'none'
      })
    })
  })

  return card
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

// INIT
buildSidebar()
render()

document.getElementById('search').addEventListener('input', () => {
  expandedCard = null
  render()
})
</script>
