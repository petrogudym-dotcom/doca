<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java — Справочник</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --bg-secondary: #f7f6f3;
    --bg-tertiary: #f0efe9;
    --text: #1a1a18;
    --text-secondary: #5a5a55;
    --text-tertiary: #9a9a92;
    --border: rgba(0,0,0,0.1);
    --border-med: rgba(0,0,0,0.18);
    --radius: 8px;
    --radius-lg: 12px;
    --font: 'Inter', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a18;
      --bg-secondary: #242420;
      --bg-tertiary: #2c2c28;
      --text: #f0efe9;
      --text-secondary: #a0a098;
      --text-tertiary: #606058;
      --border: rgba(255,255,255,0.1);
      --border-med: rgba(255,255,255,0.18);
    }
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    border-bottom: 0.5px solid var(--border);
    padding: 1.25rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
    backdrop-filter: blur(8px);
  }
  .header-left h1 { font-size: 17px; font-weight: 600; color: var(--text); }
  .header-left p { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }

  .breadcrumb {
    display: flex; align-items: center; gap: 5px;
    font-size: 12px; color: var(--text-tertiary);
  }
  .breadcrumb a {
    color: var(--text-tertiary); text-decoration: none;
    transition: color 0.15s;
  }
  .breadcrumb a:hover { color: var(--text-secondary); text-decoration: underline; }
  .breadcrumb span.sep { color: var(--text-tertiary); opacity: 0.5; }
  .breadcrumb span.current { color: var(--text-secondary); }

  .search-wrap {
    position: relative;
    flex: 1;
    max-width: 280px;
  }
  .search-wrap svg {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px; height: 14px;
    color: var(--text-tertiary);
    pointer-events: none;
  }
  .search-wrap input {
    width: 100%;
    padding: 8px 12px 8px 32px;
    font-size: 13px;
    font-family: var(--font);
    border: 0.5px solid var(--border-med);
    border-radius: 20px;
    background: var(--bg-secondary);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  .search-wrap input:focus { border-color: #7f77dd; }
  .search-wrap input::placeholder { color: var(--text-tertiary); }

  /* LAYOUT */
  .layout { display: flex; min-height: calc(100vh - 64px); }

  /* SIDEBAR */
  .sidebar {
    width: 200px;
    flex-shrink: 0;
    border-right: 0.5px solid var(--border);
    padding: 1.25rem 0;
    position: sticky;
    top: 64px;
    height: calc(100vh - 64px);
    overflow-y: auto;
  }
  .sidebar-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-tertiary);
    padding: 0 1rem 8px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 1rem;
    font-size: 13px;
    color: var(--text-secondary);
    cursor: pointer;
    border-radius: 0;
    transition: all 0.12s;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
  }
  .nav-item:hover { color: var(--text); background: var(--bg-secondary); }
  .nav-item.active {
    color: var(--text);
    background: var(--bg-tertiary);
    font-weight: 500;
    border-right: 2px solid #7f77dd;
  }
  .nav-item .icon { font-size: 14px; width: 18px; text-align: center; }
  .nav-badge {
    margin-left: auto;
    font-size: 10px;
    color: var(--text-tertiary);
    background: var(--bg-tertiary);
    padding: 1px 6px;
    border-radius: 10px;
  }

  /* MAIN */
  .main { flex: 1; padding: 2rem; max-width: 900px; }

  /* SECTION */
  .section-block { margin-bottom: 2.5rem; }
  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 1rem;
    padding-bottom: 10px;
    border-bottom: 0.5px solid var(--border);
  }
  .section-icon {
    width: 30px; height: 30px;
    border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; flex-shrink: 0;
  }
  .section-title { font-size: 15px; font-weight: 600; color: var(--text); }
  .section-count { margin-left: auto; font-size: 12px; color: var(--text-tertiary); }

  .topics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 10px;
  }

  /* CARD */
  .topic-card {
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1rem 1.125rem;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .topic-card:hover { border-color: var(--border-med); }
  .topic-card.expanded { border-color: #7f77dd; }

  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .card-name { font-size: 14px; font-weight: 500; color: var(--text); line-height: 1.3; }
  .card-tag {
    font-size: 10px; padding: 2px 7px;
    border-radius: 10px; flex-shrink: 0; margin-top: 2px; font-weight: 500;
  }
  .tag-jvm      { background: #EEEDFE; color: #3C3489; }
  .tag-threads  { background: #E1F5EE; color: #085041; }
  .tag-spring   { background: #EAF3DE; color: #27500A; }
  .tag-design   { background: #FAEEDA; color: #633806; }
  .tag-basics   { background: #E8F0FE; color: #1A3B6E; }
  .tag-oop      { background: #FDE8F0; color: #6E1A4A; }
  .tag-advanced { background: #F0E8FE; color: #3B1A6E; }
  .tag-patterns { background: #FEF3E8; color: #6E3B1A; }
  .tag-database { background: #E1F0F5; color: #0A3D50; }
  .tag-rest     { background: #FEF8E8; color: #5A4E0A; }
  .tag-micro    { background: #E8FEF0; color: #1A6E3B; }
  .tag-devops   { background: #F5E8FE; color: #50106E; }
  .tag-soft     { background: #F0F0F0; color: #444444; }

  @media (prefers-color-scheme: dark) {
    .tag-jvm     { background: #26215C; color: #CECBF6; }
    .tag-threads { background: #04342C; color: #9FE1CB; }
    .tag-spring  { background: #173404; color: #C0DD97; }
    .tag-design  { background: #412402; color: #FAC775; }
    .tag-basics  { background: #0D1F3A; color: #8BB4F0; }
    .tag-oop     { background: #3A0D24; color: #F08BB4; }
    .tag-advanced{ background: #1F0D3A; color: #B48BF0; }
    .tag-patterns{ background: #3A1F0D; color: #F0B48B; }
    .tag-database{ background: #0D2A3A; color: #8BD4F0; }
    .tag-rest    { background: #3A350D; color: #F0E88B; }
    .tag-micro   { background: #0D3A1F; color: #8BF0B4; }
    .tag-devops  { background: #2A0D3A; color: #D48BF0; }
    .tag-soft    { background: #2A2A2A; color: #BBBBBB; }
  }

  .card-summary { font-size: 12px; color: var(--text-secondary); margin-top: 6px; line-height: 1.5; }

  .card-details {
    display: none;
    margin-top: 12px;
    border-top: 0.5px solid var(--border);
    padding-top: 12px;
  }
  .topic-card.expanded .card-details { display: block; }

  /* LEVELS */
  .levels { display: flex; gap: 5px; margin-bottom: 12px; flex-wrap: wrap; }
  .level-btn {
    font-size: 11px; padding: 4px 10px;
    border: 0.5px solid var(--border);
    border-radius: 20px;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    font-family: var(--font);
    transition: all 0.12s;
  }
  .level-btn:hover { border-color: var(--border-med); color: var(--text); }
  .level-btn.lv1 { background: #FAEEDA; color: #633806; border-color: #FAC775; }
  .level-btn.lv2 { background: #FAECE7; color: #712B13; border-color: #F0997B; }
  .level-btn.lv3 { background: #FCEBEB; color: #791F1F; border-color: #F09595; }
  @media (prefers-color-scheme: dark) {
    .level-btn.lv1 { background: #412402; color: #FAC775; border-color: #633806; }
    .level-btn.lv2 { background: #4A1B0C; color: #F5C4B3; border-color: #712B13; }
    .level-btn.lv3 { background: #501313; color: #F7C1C1; border-color: #791F1F; }
  }

  .level-content { font-size: 13px; color: var(--text); line-height: 1.65; }

  .tradeoffs {
    margin-top: 10px; padding: 8px 10px;
    background: var(--bg-secondary);
    border-radius: var(--radius);
    font-size: 12px;
    color: var(--text-secondary);
  }
  .tradeoffs-label {
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-tertiary); margin-bottom: 4px;
  }

  .code-block {
    margin-top: 10px;
    background: var(--bg-secondary);
    border-radius: var(--radius);
    padding: 10px 12px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--text);
    line-height: 1.65;
    white-space: pre;
    overflow-x: auto;
    border: 0.5px solid var(--border);
  }

  .questions { margin-top: 10px; }
  .questions-label {
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-tertiary); margin-bottom: 6px;
  }
  .q-item {
    font-size: 12px; color: var(--text-secondary);
    padding: 5px 0;
    border-bottom: 0.5px solid var(--border);
    line-height: 1.45;
    display: flex; gap: 6px;
  }
  .q-item:last-child { border-bottom: none; }
  .q-arrow { color: var(--text-tertiary); flex-shrink: 0; }

  .links-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .ext-link {
    font-size: 11px; padding: 4px 10px;
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    color: #185FA5;
    text-decoration: none;
    background: var(--bg);
    transition: background 0.12s;
  }
  .ext-link:hover { background: var(--bg-secondary); }
  @media (prefers-color-scheme: dark) { .ext-link { color: #85B7EB; } }

  .no-results {
    text-align: center; padding: 3rem;
    color: var(--text-tertiary); font-size: 14px;
  }

  /* RESPONSIVE */
  @media (max-width: 640px) {
    .sidebar { display: none; }
    .header { padding: 1rem; }
    .main { padding: 1rem; }
    .topics-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <nav class="breadcrumb" aria-label="Навигация">
      <a href="../">doca</a>
      <span class="sep">/</span>
      <span class="current">Java</span>
    </nav>
    <h1>Senior Java Developer</h1>

  </div>
  <div class="search-wrap">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <circle cx="6.5" cy="6.5" r="4"/>
      <path d="M11 11l2.5 2.5"/>
    </svg>
    <input type="text" id="search" placeholder="Поиск..." aria-label="Поиск по справочнику">

</header>

<div class="layout">
  <nav class="sidebar" aria-label="Разделы справочника">
    <div class="sidebar-label">Разделы</div>
    <div id="sidebarNav"></div>
  </nav>
  <main class="main" id="mainContent"></main>
</div>

<script>
const DATA = [
  {
    id:'basics', title:'Core Java Fundamentals', icon:'📝', iconBg:'#E8F0FE',
    topics:[
      {
        name:'Java Key Features', tag:'basics', tagLabel:'Basics',
        summary:'Object-oriented, platform-independent, strongly typed language with automatic memory management and rich standard library.',
        short:'Java is a general-purpose, OOP language compiled to bytecode running on the JVM. Key features: write once run anywhere (WORA), garbage collection, multithreading, extensive APIs, and backward compatibility.',
        medium:{
          theory:'Java source compiles to platform-independent bytecode executed by the JVM. The JVM provides memory management (GC), security sandboxing, and JIT compilation for performance. Java enforces strong typing, supports generics, and has a massive ecosystem (Spring, Hibernate, etc.).',
          tradeoffs:'Pros: portability, mature ecosystem, strong backward compatibility, large talent pool. Cons: verbosity compared to Kotlin/Scala, slower startup than native languages, higher memory footprint.',
          code:`// Hello World in Java
public class Main {

        System.out.println("Hello, World!");
    }
}

// Compile and run:
// javac Main.java
// java Main`
        },
        links:[
          {label:'Java Documentation', url:'https://docs.oracle.com/en/java/'},
          {label:'JVM Specification', url:'https://docs.oracle.com/javase/specs/jvms/se21/html/'}
        ],
        questions:['What is WORA?','How does JIT compilation work?','What are the main Java editions (SE, EE)?']
      },
      {
        name:'Compile and Run Java', tag:'basics', tagLabel:'Basics',
        summary:'javac compiles .java to .class bytecode; java executes the bytecode on the JVM.',
        short:'Use javac to compile source to bytecode (.class files), then java to run the class containing main(). Since Java 11, java can compile and run a single-file program directly.',
        medium:{
          theory:'javac Main.java produces Main.class containing bytecode. java Main loads the class, finds the public static void main(String[]) method, and executes it. The JVM handles class loading, linking, and initialization. Java 11+ supports single-file source-code programs: java Main.java.',
          tradeoffs:'javac is fast for small projects; build tools (Maven, Gradle) handle dependencies and compilation for larger projects. Single-file execution is great for scripts and learning but not for production.',
          code:`// Traditional compilation
javac MyApp.java
java MyApp

// Java 11+ single-file execution
java MyApp.java

// With classpath
java -cp lib/dependency.jar:classes MyApp

// Java 21+ unnamed classes (JEP 445)
void main() {
    System.out.println("Hello!");
}`
        },
        links:[
          {label:'JEP 330: Launch Single-File Programs', url:'https://openjdk.org/jeps/330'},
          {label:'javac Reference', url:'https://docs.oracle.com/en/java/javase/21/docs/specs/man/javac.html'}
        ],
        questions:['What is the difference between classpath and module path?','How does java -jar work?','What is the role of the bootstrap class loader?']
      },
      {
        name:'JDK vs JRE vs JVM', tag:'basics', tagLabel:'Basics',
        summary:'JVM executes bytecode, JRE = JVM + libraries, JDK = JRE + development tools (javac, jdb).',
        short:'JVM is the runtime engine that executes bytecode. JRE bundles JVM + core libraries needed to run Java apps. JDK includes JRE plus development tools like javac, jar, jdb, and jconsole.',
        medium:{
          theory:'JVM (Java Virtual Machine) is the abstract machine that loads, verifies, and executes bytecode. JRE (Java Runtime Environment) = JVM + java.* and javax.* class libraries. JDK (Java Development Kit) = JRE + development tools (javac compiler, jar archiver, javadoc generator, jdb debugger). Since Java 9, the modular system (JPMS) replaced the monolithic JRE with configurable runtime images via jlink.',
          tradeoffs:'For production deployment, use jlink to create minimal custom runtime images containing only required modules. JDK is needed for development; JRE (or custom runtime) suffices for running applications.',
          code:`// Check installed JDK version
java -version
javac -version

// Create custom runtime with jlink (Java 9+)
jlink --module-path $JAVA_HOME/jmods \\
      --add-modules java.base,java.logging \\
      --output custom-jre

// Run app with custom JRE
custom-jre/bin/java -jar app.jar`
        },
        links:[
          {label:'JEP 220: Modular Run-Time Images', url:'https://openjdk.org/jeps/220'},
          {label:'JDK vs JRE vs JVM', url:'https://docs.oracle.com/en/java/javase/21/install/'}
        ],
        questions:['What modules does java.base contain?','How does jlink reduce deployment size?','What replaced rt.jar in Java 9+?']
      },
      {
        name:'Platform Independence', tag:'basics', tagLabel:'Basics',
        summary:'Java compiles to platform-neutral bytecode that runs on any OS with a compatible JVM.',
        short:'Java achieves platform independence through bytecode: javac compiles source to .class files containing bytecode, which the JVM on any platform interprets or JIT-compiles to native code.',
        medium:{
          theory:'The "Write Once, Run Anywhere" promise works because the JVM abstracts OS differences. Bytecode is a set of instructions for the JVM, not for any specific CPU/OS. Each platform provides its own JVM implementation that translates bytecode to native instructions. Caveats: JNI native code, platform-specific file paths, and GUI toolkits can break portability.',
          tradeoffs:'True portability for pure Java code; but native libraries, system properties, and file separators require platform-aware coding. Performance is near-native thanks to JIT, but startup is slower than compiled languages.',
          code:`// Platform-independent file path
Path path = Path.of("data", "config.json");  // handles OS separator

// Platform-dependent (avoid)
Path bad = Path.of("data\\\\config.json");  // Windows-only

// Check platform at runtime
String os = System.getProperty("os.name");
String sep = File.separator;  // or use Path API`
        },
        links:[
          {label:'Java Architecture', url:'https://docs.oracle.com/en/java/javase/21/docs/api/'}
        ],

      {
        name:'Primitive Types vs Objects', tag:'basics', tagLabel:'Basics',
        summary:'Primitives are value types stored on stack; objects are reference types on heap with overhead.',
        short:'Java has 8 primitives (byte, short, int, long, float, double, char, boolean) that hold raw values directly. Objects are reference types — variables hold references to heap-allocated instances with metadata overhead.',
        medium:{
          theory:'Primitives are stored directly in stack frames (local variables) or as fields within objects. They have no methods, no identity, and default values (0, false). Objects live on the heap, have identity (==), can be null, and carry object header overhead (~16 bytes). Autoboxing bridges the two: int ↔ Integer, but creates heap objects.',
          tradeoffs:'Primitives: faster, less memory, no null safety. Objects: polymorphism, methods, collections support. Use primitives for performance-critical code; Objects for APIs, collections, and null semantics.',
          code:`// Primitives — stored directly
int x = 42;          // 4 bytes on stack
double pi = 3.14;    // 8 bytes

// Objects — references to heap
Integer boxed = 42;  // reference + ~16 bytes object overhead
String s = "hello";  // reference + object on heap

// Autoboxing (convenient but allocates)
List<Integer> list = new ArrayList<>();
list.add(42);  // autoboxing: int → Integer

// Performance: primitive array vs boxed
int[] primes = new int[1_000_000];      // ~4 MB
Integer[] boxed = new Integer[1_000_000]; // ~16 MB+ (refs + objects)`

      {

        short:'The static keyword makes a member belong to the class itself rather than any instance. Static fields are shared across all instances; static methods can be called without creating an object.',
        medium:{
          theory:'Static fields exist once per classloader. Static methods cannot access instance fields or this. Static blocks execute once when the class is loaded. Static nested classes have no reference to the enclosing instance. Static imports reduce verbosity for constants and utility methods.',
          tradeoffs:'Static state is global state — hard to test and thread-safe. Use for constants, utility methods, factories. Avoid mutable static fields in concurrent code; prefer dependency injection.',
          code:`public class Config {
    // Static field — shared across all instances
    static final String APP_NAME = "MyApp";
    
    // Static initializer — runs once at class loading
    static {
        System.out.println("Config loaded");
    }
    
    // Static method — no instance needed
    static Config fromEnv() {
        return new Config(System.getenv("APP_ENV"));
    }
    
    // Static nested class — no outer reference
    static class Builder { /* ... */ }
}

// Static import
import static java.lang.Math.PI;
double area = PI * r * r;`
        },
        links:[
          {label:'Class Members — Oracle', url:'https://docs.oracle.com/javase/tutorial/java/javaOO/classvars.html'}
        ],
        questions:['When are static fields initialized?','Can you override static methods?','What is a static import?']
      },
      {
        name:'final Keyword', tag:'basics', tagLabel:'Basics',
        summary:'final prevents modification: variables cannot be reassigned, methods cannot be overridden, classes cannot be extended.',

        medium:{
          theory:'For primitives, final means the value is constant. For references, final means the reference cannot point to a different object, but the object\'s state can still change. Effectively final variables (not reassigned after initialization) can be used in lambdas. The JIT compiler can inline final fields for optimization.',
          tradeoffs:'Use final for constants, immutable classes, and method parameters to prevent accidental reassignment. Overuse can reduce readability without adding safety. Blank final fields must be assigned in every constructor.',
          code:`// final variable — cannot reassign

final List<String> list = new ArrayList<>();
list.add("ok");    // mutating object is allowed

// final method — cannot override
class Base {
    final void critical() { /* ... */ }
}

// final class — cannot extend
final class Singleton {
    static final Singleton INSTANCE = new Singleton();
    private Singleton() {}
}

// Effectively final in lambda
String name = "Alice";
Runnable r = () -> System.out.println(name);  // OK`
        },
        links:[

        ],

      },
      {
        name:'Access Modifiers', tag:'basics', tagLabel:'Basics',
        summary:'public (everywhere), protected (subclass + package), default/package-private (package), private (class only).',
        short:'Java has four access levels: public (accessible everywhere), protected (same package + subclasses), default/package-private (same package only, no keyword), and private (same class only).',

          tradeoffs:'Deadlock prevention via lock ordering is simple but requires discipline. tryLock with timeout adds complexity but enables recovery. Race conditions are often subtle — use thread-safe collections and Atomic classes rather than manual synchronization where possible.',
          code:`// Deadlock — threads waiting for each other
Object lockA = new Object(), lockB = new Object();
// Thread 1: lock A, then B
synchronized (lockA) { synchronized (lockB) { /* ... */ } }
// Thread 2: lock B, then A  — DEADLOCK!
synchronized (lockB) { synchronized (lockA) { /* ... */ } }

// Prevention: consistent lock ordering
// Both threads: always acquire lockA before lockB

// tryLock with timeout
ReentrantLock lock1 = new ReentrantLock();
ReentrantLock lock2 = new ReentrantLock();
if (lock1.tryLock(1, TimeUnit.SECONDS)) {
    try {
        if (lock2.tryLock(1, TimeUnit.SECONDS)) {
            try { /* work */ } finally { lock2.unlock(); }
        }
    } finally { lock1.unlock(); }
}

// Race condition — check-then-act
if (!map.containsKey(key)) {
    map.put(key, value);  // another thread may have inserted between check and put!
}
// Fix: ConcurrentHashMap.putIfAbsent(key, value)`

boolean dfs(char[][] g, int i, int j, String w, int k) {
    if (k == w.length()) return true;
    if (i < 0 || j < 0 || i >= g.length || j >= g[0].length) return false;
    if (g[i][j] != w.charAt(k)) return false;
    char temp = g[i][j]; g[i][j] = '#';  // mark visited
    boolean found = dfs(g, i+1, j, w, k+1) || dfs(g, i-1, j, w, k+1)
                 || dfs(g, i, j+1, w, k+1) || dfs(g, i, j-1, w, k+1);
    g[i][j] = temp;  // backtrack
    return found;
}

// First non-repeating character
char firstNonRepeating(String s) {
    LinkedHashMap<Character, Integer> freq = new LinkedHashMap<>();
    for (char c : s.toCharArray()) freq.merge(c, 1, Integer::sum);
    return freq.entrySet().stream()
        .filter(e -> e.getValue() == 1)
        .map(Map.Entry::getKey)
        .findFirst().orElse(' ');
}

public class Singleton {
    private static volatile Singleton instance;  // volatile required!
    private Singleton() {}
    
    public static Singleton getInstance() {
        if (instance == null) {                    // first check (no lock)
            synchronized (Singleton.class) {
                if (instance == null) {             // second check (locked)
                    instance = new Singleton();
                }
            }
        }
        return instance;
    }
}

// Static holder (lazy, thread-safe)
public class Singleton {
    private Singleton() {}
    private static class Holder {
        static final Singleton INSTANCE = new Singleton();
    }
    public static Singleton getInstance() { return Holder.INSTANCE; }
}`

// STATE
let activeSection = 'all'
let expandedCard = null

// BUILD SIDEBAR
function buildSidebar() {
  const nav = document.getElementById('sidebarNav')
  const allBtn = document.createElement('button')
  allBtn.className = 'nav-item active'
  allBtn.dataset.section = 'all'
  const total = DATA.reduce((s, d) => s + d.topics.length, 0)
  allBtn.innerHTML = `<span class="icon">📚</span> Все разделы <span class="nav-badge">${total}</span>`
  allBtn.onclick = () => setSection('all')
  nav.appendChild(allBtn)

  DATA.forEach(sec => {
    const btn = document.createElement('button')
    btn.className = 'nav-item'
    btn.dataset.section = sec.id
    btn.innerHTML = `<span class="icon">${sec.icon}</span> ${sec.title} <span class="nav-badge">${sec.topics.length}</span>`
    btn.onclick = () => setSection(sec.id)
    nav.appendChild(btn)
  })
}

function setSection(id) {
  activeSection = id
  expandedCard = null
  document.querySelectorAll('.nav-item').forEach(b => {
    b.classList.toggle('active', b.dataset.section === id)
  })
  render()
}

// RENDER
function render() {
  const searchVal = document.getElementById('search').value.toLowerCase().trim()
  const main = document.getElementById('mainContent')
  main.innerHTML = ''
  let totalVisible = 0

  DATA.forEach(sec => {
    if (activeSection !== 'all' && sec.id !== activeSection) return

    const filtered = sec.topics.filter(t =>
      !searchVal ||
      t.name.toLowerCase().includes(searchVal) ||
      t.summary.toLowerCase().includes(searchVal) ||
      t.short.toLowerCase().includes(searchVal) ||
      (t.medium.theory && t.medium.theory.toLowerCase().includes(searchVal))
    )
    if (!filtered.length) return
    totalVisible += filtered.length

    const block = document.createElement('div')
    block.className = 'section-block'
    block.id = 'sec-' + sec.id

    const header = document.createElement('div')
    header.className = 'section-header'
    header.innerHTML = `
      <div class="section-icon" style="background:${sec.iconBg}">${sec.icon}</div>
      <span class="section-title">${sec.title}</span>
      <span class="section-count">${filtered.length} ${plural(filtered.length, 'тема','темы','тем')}</span>
    `
    block.appendChild(header)

    const grid = document.createElement('div')
    grid.className = 'topics-grid'
    filtered.forEach(t => grid.appendChild(buildCard(t)))
    block.appendChild(grid)
    main.appendChild(block)
  })

  if (!totalVisible) {
    main.innerHTML = '<div class="no-results">Ничего не найдено. Попробуй другой запрос.</div>'
  }
}

function plural(n, f1, f2, f5) {
  const v = Math.abs(n) % 100
  if (v >= 11 && v <= 19) return f5
  const v2 = v % 10
  if (v2 === 1) return f1
  if (v2 >= 2 && v2 <= 4) return f2
  return f5
}

function buildCard(topic) {
  const card = document.createElement('div')
  card.className = 'topic-card' + (expandedCard === topic.name ? ' expanded' : '')

  const tagCls = {
    jvm:'tag-jvm', threads:'tag-threads', spring:'tag-spring', design:'tag-design',
    basics:'tag-basics', oop:'tag-oop', advanced:'tag-advanced', patterns:'tag-patterns',
    database:'tag-database', rest:'tag-rest', micro:'tag-micro', devops:'tag-devops', soft:'tag-soft'
  }[topic.tag] || 'tag-jvm'

  card.innerHTML = `
    <div class="card-top">
      <span class="card-name">${topic.name}</span>
      <span class="card-tag ${tagCls}">${topic.tagLabel}</span>
    </div>
    <div class="card-summary">${topic.summary}</div>
    <div class="card-details">
      <div class="levels">
        <button class="level-btn ${expandedCard === topic.name ? 'lv1' : ''}" data-lv="1">🟡 Кратко</button>
        <button class="level-btn" data-lv="2">🟠 Подробнее</button>
        <button class="level-btn" data-lv="3">🔴 Глубоко</button>
      </div>
      <div class="level-content" data-panel="1">
        ${topic.short}
      </div>
      <div class="level-content" data-panel="2" style="display:none">
        <p>${topic.medium.theory}</p>
        <div class="tradeoffs">
          <div class="tradeoffs-label">Trade-offs</div>
          ${topic.medium.tradeoffs}
        </div>
        <pre class="code-block">${escHtml(topic.medium.code)}</pre>
      </div>
      <div class="level-content" data-panel="3" style="display:none">
        <div class="questions">
          <div class="questions-label">Вопросы для самопроверки</div>
          ${topic.questions.map(q => `<div class="q-item"><span class="q-arrow">→</span>${q}</div>`).join('')}
        </div>
        <div class="links-row">
          ${topic.links.map(l => `<a class="ext-link" href="${l.url}" target="_blank" rel="noopener">↗ ${l.label}</a>`).join('')}
        </div>
      </div>
    </div>
  `

  // Toggle expand
  card.addEventListener('click', e => {
    if (e.target.tagName === 'BUTTON' || e.target.tagName === 'A') return
    expandedCard = expandedCard === topic.name ? null : topic.name
    render()
  })

  // Level buttons
  card.querySelectorAll('.level-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation()
      const lv = btn.dataset.lv
      card.querySelectorAll('.level-btn').forEach(b => b.className = 'level-btn')
      btn.classList.add('lv' + lv)
      card.querySelectorAll('[data-panel]').forEach(p => {
        p.style.display = p.dataset.panel === lv ? 'block' : 'none'
      })
    })
  })

  return card
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

// INIT
buildSidebar()
render()

document.getElementById('search').addEventListener('input', () => {
  expandedCard = null
  render()
})
</script>
