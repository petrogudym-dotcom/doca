<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Modeling — Справочник</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --bg-secondary: #f5f7fa;
    --bg-tertiary: #edf0f5;
    --text: #1c2033;
    --text-secondary: #4e5a72;
    --text-tertiary: #9199ab;
    --border: rgba(0,0,0,0.08);
    --border-med: rgba(0,0,0,0.15);
    --accent: #0f62fe;
    --accent-soft: #edf3ff;
    --radius: 8px;
    --radius-lg: 12px;
    --font: 'Inter', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11131a;
      --bg-secondary: #181b25;
      --bg-tertiary: #1f2333;
      --text: #e4e8f0;
      --text-secondary: #8892a4;
      --text-tertiary: #434d60;
      --border: rgba(255,255,255,0.07);
      --border-med: rgba(255,255,255,0.14);
      --accent: #4d90fe;
      --accent-soft: #0a1a3d;
    }
  }

  body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.6; min-height: 100vh; }

  /* HEADER */
  .header {
    border-bottom: 0.5px solid var(--border);
    padding: 0.875rem 2rem;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
    position: sticky; top: 0; background: var(--bg); z-index: 100;
  }
  .header-brand { display: flex; align-items: center; gap: 10px; }
  .header-logo {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, #0f62fe, #8b3fc8);
    border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .header-titles h1 { font-size: 16px; font-weight: 600; }
  .header-titles p { font-size: 11px; color: var(--text-tertiary); margin-top: 1px; }

  .header-right { display: flex; align-items: center; gap: 12px; }
  .breadcrumb { font-size: 12px; color: var(--text-tertiary); display: flex; align-items: center; gap: 4px; }
  .breadcrumb a { color: var(--accent); text-decoration: none; }
  .breadcrumb a:hover { text-decoration: underline; }

  .search-wrap { position: relative; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 13px; height: 13px; color: var(--text-tertiary); pointer-events: none; }
  .search-wrap input {
    padding: 7px 12px 7px 30px; font-size: 12px; font-family: var(--font);
    border: 0.5px solid var(--border-med); border-radius: 20px;
    background: var(--bg-secondary); color: var(--text); outline: none; width: 210px;
    transition: border-color 0.15s, width 0.2s;
  }
  .search-wrap input:focus { border-color: var(--accent); width: 250px; }
  .search-wrap input::placeholder { color: var(--text-tertiary); }

  /* LAYOUT */
  .layout { display: flex; min-height: calc(100vh - 57px); }

  /* SIDEBAR */
  .sidebar {
    width: 215px; flex-shrink: 0;
    border-right: 0.5px solid var(--border);
    padding: 1.25rem 0;
    position: sticky; top: 57px;
    height: calc(100vh - 57px); overflow-y: auto;
  }
  .sidebar-label {
    font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-tertiary);
    padding: 0 1rem 6px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 1rem; font-size: 13px; color: var(--text-secondary);
    cursor: pointer; border: none; background: none;
    width: 100%; text-align: left; transition: all 0.12s;
  }
  .nav-item:hover { color: var(--text); background: var(--bg-secondary); }
  .nav-item.active { color: var(--accent); background: var(--accent-soft); font-weight: 500; border-right: 2px solid var(--accent); }
  .nav-item .ni { font-size: 14px; width: 18px; text-align: center; flex-shrink: 0; }
  .nav-badge { margin-left: auto; font-size: 10px; color: var(--text-tertiary); background: var(--bg-tertiary); padding: 1px 6px; border-radius: 10px; }

  /* MAIN */
  .main { flex: 1; padding: 2rem; max-width: 980px; }

  /* SECTION */
  .section-block { margin-bottom: 2.5rem; }
  .section-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 1.25rem; padding-bottom: 10px;
    border-bottom: 0.5px solid var(--border);
  }
  .section-icon { width: 32px; height: 32px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .section-meta { flex: 1; }
  .section-title { font-size: 15px; font-weight: 600; }
  .section-desc { font-size: 12px; color: var(--text-tertiary); margin-top: 1px; }
  .section-count { font-size: 11px; color: var(--text-tertiary); white-space: nowrap; }

  .topics-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(295px, 1fr)); gap: 10px; }

  /* CARD */
  .topic-card {
    background: var(--bg); border: 0.5px solid var(--border);
    border-radius: var(--radius-lg); padding: 1rem 1.125rem;
    cursor: pointer; transition: border-color 0.15s;
  }
  .topic-card:hover { border-color: var(--border-med); }
  .topic-card.expanded { border-color: var(--accent); }

  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .card-name { font-size: 14px; font-weight: 500; line-height: 1.3; }
  .card-tag { font-size: 10px; padding: 2px 7px; border-radius: 10px; flex-shrink: 0; margin-top: 2px; font-weight: 500; }

  .tag-method   { background:#EDF3FF; color:#1a4dbf; }
  .tag-schema   { background:#E8F5E9; color:#1b5e20; }
  .tag-scd      { background:#FFF3E0; color:#7c3a00; }
  .tag-fact     { background:#F3E8FF; color:#5b21b6; }
  .tag-concept  { background:#FEE2E2; color:#991b1b; }

  @media (prefers-color-scheme: dark) {
    .tag-method   { background:#0a1a3d; color:#7aadfa; }
    .tag-schema   { background:#052e16; color:#86efac; }
    .tag-scd      { background:#2d1600; color:#fbbf24; }
    .tag-fact     { background:#2e1065; color:#c4b5fd; }
    .tag-concept  { background:#450a0a; color:#fca5a5; }
  }

  .card-summary { font-size: 12px; color: var(--text-secondary); margin-top: 6px; line-height: 1.5; }

  .card-details { display: none; margin-top: 12px; border-top: 0.5px solid var(--border); padding-top: 12px; }
  .topic-card.expanded .card-details { display: block; }

  .levels { display: flex; gap: 5px; margin-bottom: 12px; flex-wrap: wrap; }
  .level-btn {
    font-size: 11px; padding: 4px 10px;
    border: 0.5px solid var(--border); border-radius: 20px;
    background: transparent; color: var(--text-secondary);
    cursor: pointer; font-family: var(--font); transition: all 0.12s;
  }
  .level-btn:hover { border-color: var(--border-med); color: var(--text); }
  .level-btn.lv1 { background:#FFF8E1; color:#92400e; border-color:#fbbf24; }
  .level-btn.lv2 { background:#FEF3C7; color:#78350f; border-color:#f59e0b; }
  .level-btn.lv3 { background:#FEE2E2; color:#7f1d1d; border-color:#f87171; }
  @media (prefers-color-scheme: dark) {
    .level-btn.lv1 { background:#2d1f00; color:#fcd34d; border-color:#92400e; }
    .level-btn.lv2 { background:#3b1f00; color:#fbbf24; border-color:#78350f; }
    .level-btn.lv3 { background:#450a0a; color:#fca5a5; border-color:#7f1d1d; }
  }

  .level-content { font-size: 13px; color: var(--text); line-height: 1.65; }

  .tradeoffs {
    margin-top: 10px; padding: 10px 12px;
    background: var(--bg-secondary); border-radius: var(--radius);
    font-size: 12px; color: var(--text-secondary);
    border-left: 2px solid var(--border-med);
  }
  .tradeoffs-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-tertiary); margin-bottom: 4px; }

  .diagram {
    margin-top: 10px; background: var(--bg-secondary);
    border-radius: var(--radius); padding: 10px 12px;
    font-family: var(--font-mono); font-size: 11px;
    color: var(--text); line-height: 1.75; white-space: pre;
    overflow-x: auto; border: 0.5px solid var(--border);
  }

  .code-block {
    margin-top: 10px; background: var(--bg-secondary);
    border-radius: var(--radius); padding: 10px 12px;
    font-family: var(--font-mono); font-size: 11.5px;
    color: var(--text); line-height: 1.65; white-space: pre;
    overflow-x: auto; border: 0.5px solid var(--border);
  }

  .tools-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .tool-chip {
    font-size: 11px; padding: 3px 8px;
    background: var(--bg-tertiary); border: 0.5px solid var(--border);
    border-radius: var(--radius); color: var(--text-secondary);
    font-family: var(--font-mono);
  }

  .scd-types { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin-top: 8px; }
  .scd-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 22px; border-radius: 4px;
    font-size: 10px; font-weight: 700; font-family: var(--font-mono);
    background: var(--bg-tertiary); color: var(--text-secondary);
    border: 0.5px solid var(--border);
  }
  .scd-desc { font-size: 12px; color: var(--text-secondary); align-self: center; }

  .questions { margin-top: 10px; }
  .questions-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-tertiary); margin-bottom: 6px; }
  .q-item { font-size: 12px; color: var(--text-secondary); padding: 5px 0; border-bottom: 0.5px solid var(--border); line-height: 1.45; display: flex; gap: 6px; }
  .q-item:last-child { border-bottom: none; }
  .q-arrow { color: var(--text-tertiary); flex-shrink: 0; }

  .links-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .ext-link { font-size: 11px; padding: 4px 10px; border: 0.5px solid var(--border); border-radius: var(--radius); color: var(--accent); text-decoration: none; background: var(--bg); transition: background 0.12s; }
  .ext-link:hover { background: var(--bg-secondary); }

  .compare-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 11.5px; }
  .compare-table th { background: var(--bg-tertiary); color: var(--text-secondary); font-weight: 600; padding: 6px 8px; text-align: left; border: 0.5px solid var(--border); font-size: 11px; }
  .compare-table td { padding: 6px 8px; border: 0.5px solid var(--border); color: var(--text-secondary); vertical-align: top; line-height: 1.4; }
  .compare-table tr:hover td { background: var(--bg-secondary); }

  .no-results { text-align: center; padding: 3rem; color: var(--text-tertiary); font-size: 14px; }

  @media (max-width: 640px) {
    .sidebar { display: none; }
    .header { padding: 0.875rem 1rem; }
    .main { padding: 1rem; }
    .topics-grid { grid-template-columns: 1fr; }
    .search-wrap input { width: 150px; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-brand">
    <div class="header-logo">🗂️</div>
    <div class="header-titles">
      <h1>Data Modeling</h1>
      <p>Личный справочник · 18 тем · 3 уровня глубины</p>
    </div>
  </div>
  <div class="header-right">
    <div class="breadcrumb">
      <a href="../architecture/">Архитектура</a>
      <span>/</span>
      <a href="../big_data/">Big Data</a>
      <span>/</span>
      <span>Data Modeling</span>
    </div>
    <div class="search-wrap">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4"/><path d="M11 11l2.5 2.5"/></svg>
      <input type="text" id="search" placeholder="Поиск..." aria-label="Поиск">
    </div>
  </div>
</header>

<div class="layout">
  <nav class="sidebar" aria-label="Разделы">
    <div class="sidebar-label">Разделы</div>
    <div id="sidebarNav"></div>
  </nav>
  <main class="main" id="mainContent"></main>
</div>

<script>
const DATA = [
  {
    id: 'methodologies', title: 'Методологии', icon: '🏗️',
    iconBg: '#EDF3FF', desc: 'Философии построения DWH — Kimball, Inmon, Data Vault',
    topics: [
      {
        name: 'Kimball (Dimensional Modeling)',
        tag: 'method', tagLabel: 'Методология',
        summary: 'Bottom-up подход: сначала Data Marts под конкретные бизнес-процессы, из которых складывается DWH. Star/Snowflake схемы. Самый популярный подход.',
        short: 'Строим от конкретного бизнес-процесса вверх. Каждый Data Mart — Star Schema с Fact + Dimension таблицами. DWH = набор согласованных (conformed) Data Marts.',
        medium: {
          theory: 'Ralph Kimball (1996). 4 шага: 1) выбрать бизнес-процесс (продажи, доставка), 2) определить grain (уровень детализации строки), 3) определить dimensions, 4) определить facts. Conformed Dimensions — одна dim_date, dim_customer для всех Marts.',
          tradeoffs: 'Плюс: быстро доставляет ценность, понятно бизнесу, отличная производительность запросов. Минус: Conformed Dimensions сложно поддерживать при росте, Data Marts могут расходиться без строгой дисциплины.',
          code: `-- Grain: одна строка = одна продажа
-- Fact Table:
CREATE TABLE fact_sales (
  sale_id       INT,
  date_key      INT  REFERENCES dim_date,      -- Conformed
  customer_key  INT  REFERENCES dim_customer,  -- Conformed
  product_key   INT  REFERENCES dim_product,
  store_key     INT  REFERENCES dim_store,
  quantity      INT,
  amount        DECIMAL(10,2),
  discount      DECIMAL(5,2)
);`
        },
        tools: ['dbt', 'Snowflake', 'BigQuery', 'Redshift', 'Looker'],
        links: [
          { label: 'The Data Warehouse Toolkit (Kimball)', url: 'https://www.kimballgroup.com/data-warehouse-business-intelligence-resources/books/data-warehouse-dw-toolkit/' },
          { label: 'Kimball Group', url: 'https://www.kimballgroup.com/' }
        ],
        questions: ['Что такое grain и почему его важно объявить первым?', 'Что такое Conformed Dimension и почему это сложно?', 'Чем Kimball отличается от Inmon на практике?']
      },
      {
        name: 'Inmon (3NF / Enterprise DWH)',
        tag: 'method', tagLabel: 'Методология',
        summary: 'Top-down подход: сначала единый нормализованный (3NF) корпоративный DWH, потом Data Marts как представления поверх него.',
        short: 'Bill Inmon: DWH = subject-oriented, integrated, non-volatile, time-variant. Центральный DWH в 3NF — единый источник истины. Data Marts строятся сверху как витрины.',
        medium: {
          theory: 'Inmon (1990). Центральный DWH хранит данные в Third Normal Form (3NF) — минимальная избыточность, максимальная целостность. Data Marts — агрегированные, денормализованные представления для конкретных отделов (finance, marketing).',
          tradeoffs: 'Плюс: единый источник истины, высокая целостность данных, устойчив к изменениям бизнеса. Минус: долго до первой ценности, сложные запросы из-за множества JOIN, требует сильной data-команды.',
          code: `-- 3NF: нормализованные таблицы без избыточности
-- Клиент и адрес — раздельно:
CREATE TABLE customer (customer_id INT PRIMARY KEY, name VARCHAR);
CREATE TABLE address  (address_id INT PRIMARY KEY, customer_id INT, street VARCHAR, city VARCHAR);
CREATE TABLE order    (order_id INT PRIMARY KEY, customer_id INT, date DATE, total DECIMAL);

-- Data Mart поверх — денормализованный для аналитики:
CREATE VIEW sales_mart AS
  SELECT o.order_id, c.name, a.city, o.total, o.date
  FROM order o JOIN customer c USING(customer_id)
               JOIN address  a USING(customer_id);`
        },
        tools: ['Oracle', 'Teradata', 'IBM Db2', 'SQL Server'],
        links: [
          { label: 'Building the Data Warehouse (Inmon)', url: 'https://www.amazon.com/Building-Data-Warehouse-W-Inmon/dp/0764599445' },
          { label: 'Inmon vs Kimball', url: 'https://www.zentut.com/data-warehouse/kimball-and-inmon-data-warehouse-architectures/' }
        ],
        questions: ['В чём главное отличие Inmon от Kimball?', 'Почему Inmon медленнее доставляет ценность?', 'Когда Inmon предпочтительнее?']
      },
      {
        name: 'Data Vault 2.0',
        tag: 'method', tagLabel: 'Методология',
        summary: 'Hub-and-Spoke методология: Hubs (бизнес-ключи) + Links (связи) + Satellites (атрибуты). Заточена под аудит, историзацию и гибкость.',
        short: 'Hub — уникальный бизнес-ключ (customer_id). Link — связь между Hubs (заказ клиента). Satellite — атрибуты и история изменений Hub или Link. Все данные append-only.',
        medium: {
          theory: 'Dan Linstedt (2000). Три типа таблиц: Hub (бизнес-ключ + hash + load_date + record_source), Link (FK на Hubs + hash + load_date), Satellite (FK на Hub/Link + все атрибуты + load_date + end_date). Весь Data Vault — append-only, никаких UPDATE.',
          tradeoffs: 'Плюс: полный audit trail, легко добавлять новые источники без переработки, параллельная загрузка. Минус: очень много таблиц, сложные запросы, нужен опытный архитектор, производительность без Gold-слоя плохая.',
          code: `-- Hub: только бизнес-ключ
CREATE TABLE hub_customer (
  hub_customer_hk  CHAR(32) PRIMARY KEY, -- MD5(customer_id)
  customer_id      VARCHAR NOT NULL,      -- бизнес-ключ
  load_date        TIMESTAMP,
  record_source    VARCHAR                -- 'CRM', 'SHOPIFY' и т.д.
);

-- Satellite: все атрибуты с историей
CREATE TABLE sat_customer_details (
  hub_customer_hk  CHAR(32),
  load_date        TIMESTAMP,
  end_date         TIMESTAMP,            -- NULL = текущая запись
  name             VARCHAR,
  email            VARCHAR,
  city             VARCHAR,
  PRIMARY KEY (hub_customer_hk, load_date)
);`
        },
        tools: ['dbt', 'AutomateDV', 'dbtvault', 'Snowflake', 'Azure Synapse'],
        links: [
          { label: 'Data Vault Alliance', url: 'https://datavaultalliance.com/' },
          { label: 'dbtvault docs', url: 'https://automate-dv.readthedocs.io/' }
        ],
        questions: ['Чем Hub отличается от Dimension таблицы?', 'Почему Data Vault append-only?', 'Зачем нужен Gold/Mart слой поверх Data Vault?']
      }
    ]
  },
  {
    id: 'schemas', title: 'Схемы хранилищ', icon: '⭐',
    iconBg: '#E8F5E9', desc: 'Как организовать таблицы в хранилище',
    topics: [
      {
        name: 'Star Schema',
        tag: 'schema', tagLabel: 'Схема',
        summary: 'Центральная Fact таблица окружена Dimension таблицами. Простота, скорость, читаемость. Стандарт для Gold-слоя и BI.',
        short: 'Fact в центре, Dimensions по краям. Dimensions денормализованы (всё в одной таблице). Минимум JOIN-ов → максимум скорости. Kimball-стандарт.',
        medium: {
          theory: 'Fact таблица содержит измеримые события (продажа, клик, платёж) + FK на все dimensions. Dimension денормализована: dim_product содержит и category_name, и brand_name без отдельных таблиц. Это даёт скорость за счёт избыточности.',
          tradeoffs: 'Плюс: быстрые запросы (мало JOIN), понятно аналитикам и BI-инструментам, простота. Минус: дублирование данных в dimensions, обновление dimension = UPDATE многих строк (решается SCD).',
          code: `-- Star Schema: продажи
         dim_date          dim_store
            ↑                  ↑
dim_customer ← fact_sales → dim_product
                              ↓
                          (всё в одной dim)
                    product_name, category,
                    brand, supplier — всё тут

SELECT
  d.month, p.category, SUM(f.amount) AS revenue
FROM fact_sales f
JOIN dim_date    d ON f.date_key    = d.date_key
JOIN dim_product p ON f.product_key = p.product_key
GROUP BY 1, 2;  -- всего 2 JOIN!`
        },
        tools: ['dbt', 'Snowflake', 'BigQuery', 'Redshift', 'Power BI', 'Tableau'],
        links: [
          { label: 'Star Schema — Kimball', url: 'https://www.kimballgroup.com/data-warehouse-business-intelligence-resources/kimball-techniques/dimensional-modeling-techniques/' }
        ],
        questions: ['Почему Star Schema быстрее Snowflake Schema?', 'Как обновлять dimensions в Star Schema (SCD)?', 'Чем fact отличается от dimension?']
      },
      {
        name: 'Snowflake Schema',
        tag: 'schema', tagLabel: 'Схема',
        summary: 'Расширение Star Schema: Dimension таблицы нормализованы и разбиты на несколько связанных таблиц. Меньше дублей, больше JOIN.',
        short: 'Как Star Schema, но Dimensions нормализованы. dim_product → dim_category → dim_department. Меньше избыточности данных, сложнее запросы.',

          tradeoffs: 'Плюс: единственный способ моделировать некоторые события, позволяет "negative analysis". Минус: непривычно для аналитиков, легко перепутать с ошибкой моделирования.',
          code: `-- Event Factless: зачисление студента на курс
CREATE TABLE fact_enrollment (
  date_key       INT,  -- FK → dim_date
  student_key    INT,  -- FK → dim_student
  course_key     INT,  -- FK → dim_course
  teacher_key    INT   -- FK → dim_teacher
  -- НЕТ числовых мер!
);

-- Запрос: сколько студентов на каждом курсе?
SELECT c.course_name, COUNT(*) AS students
FROM fact_enrollment f
JOIN dim_course c ON f.course_key = c.course_key
GROUP BY 1;

-- Coverage Factless: какие товары НЕ продавались?
SELECT p.product_name
FROM dim_product p
LEFT JOIN fact_sales s ON p.product_key = s.product_key
WHERE s.product_key IS NULL;  -- товары без продаж`
        },
        tools: ['SQL', 'dbt', 'BigQuery', 'Snowflake'],
        links: [{ label: 'Factless Fact Table — Microsoft', url: 'https://learn.microsoft.com/en-us/fabric/data-warehouse/dimensional-modeling-fact-tables' }],
        questions: ['Как получить метрику из Factless Fact таблицы?', 'Что такое "coverage analysis" и зачем нужна Factless таблица?', 'Как отличить Factless Fact от ошибки моделирования?']
      },
      {
        name: 'Aggregate Fact Table',
        tag: 'fact', tagLabel: 'Fact таблица',
        summary: 'Предварительно агрегированная версия Transaction Fact таблицы. Ускоряет часто используемые запросы в 10-100x.',
        short: 'Rollup базовой Fact таблицы до более высокой гранулярности: из daily transaction → monthly summary. BI-инструменты могут автоматически роутить запросы к агрегату.',
        medium: {
          theory: 'Aggregate Fact таблица = Materialized View над Transaction Fact. Например: fact_sales (строка на транзакцию) → fact_sales_monthly (строка на месяц+продукт+регион). Используется transparent aggregation: BI-инструмент автоматически выбирает нужный уровень.',
          tradeoffs: 'Плюс: ускорение типичных запросов без изменения базовой таблицы. Минус: хранение дополнительных данных, нужно обновлять при изменении базовой таблицы, сложность transparent routing.',
          code: `-- Base: fact_sales (миллиарды строк, daily grain)
-- Aggregate: fact_sales_monthly (миллионы строк, monthly grain)
CREATE TABLE fact_sales_monthly AS
SELECT
  -- понижаем гранулярность: day → month
  DATE_TRUNC('month', d.date)  AS month,
  f.product_key,
  f.store_key,
  f.customer_segment_key,
  -- агрегируем меры:
  SUM(f.amount)       AS total_amount,
  SUM(f.quantity)     AS total_quantity,
  COUNT(DISTINCT f.customer_key) AS unique_customers,
  COUNT(*)            AS transaction_count
FROM fact_sales f
JOIN dim_date d ON f.date_key = d.date_key
GROUP BY 1, 2, 3, 4;

-- Запрос на годовой отчёт → автоматически к fact_sales_monthly`
        },
        tools: ['dbt', 'Snowflake', 'BigQuery', 'Redshift', 'Power BI Aggregations'],
        links: [{ label: 'Aggregate Fact Tables — Kimball', url: 'https://www.kimballgroup.com/data-warehouse-business-intelligence-resources/kimball-techniques/dimensional-modeling-techniques/aggregates/' }],
        questions: ['Чем Aggregate Fact отличается от Materialized View?', 'Что такое transparent aggregation?', 'Как поддерживать Aggregate Fact при изменении Transaction Fact?']
      }
    ]
  }
];

// STATE
let activeSection = 'all';
let expandedCard = null;

// SIDEBAR
function buildSidebar() {
  const nav = document.getElementById('sidebarNav');
  const total = DATA.reduce((s, d) => s + d.topics.length, 0);
  const allBtn = document.createElement('button');
  allBtn.className = 'nav-item active';
  allBtn.dataset.section = 'all';
  allBtn.innerHTML = `<span class="ni">📚</span> Все темы <span class="nav-badge">${total}</span>`;
  allBtn.onclick = () => setSection('all');
  nav.appendChild(allBtn);
  DATA.forEach(sec => {
    const btn = document.createElement('button');
    btn.className = 'nav-item';
    btn.dataset.section = sec.id;
    btn.innerHTML = `<span class="ni">${sec.icon}</span> ${sec.title} <span class="nav-badge">${sec.topics.length}</span>`;
    btn.onclick = () => setSection(sec.id);
    nav.appendChild(btn);
  });
}

function setSection(id) {
  activeSection = id;
  expandedCard = null;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.section === id));
  render();
}

// RENDER
function render() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const main = document.getElementById('mainContent');
  main.innerHTML = '';
  let total = 0;

  DATA.forEach(sec => {
    if (activeSection !== 'all' && sec.id !== activeSection) return;
    const filtered = sec.topics.filter(t =>
      !q ||
      t.name.toLowerCase().includes(q) ||
      t.summary.toLowerCase().includes(q) ||
      t.short.toLowerCase().includes(q) ||
      (t.tools && t.tools.some(tool => tool.toLowerCase().includes(q)))
    );
    if (!filtered.length) return;
    total += filtered.length;

    const block = document.createElement('div');
    block.className = 'section-block';
    block.innerHTML = `
      <div class="section-header">
        <div class="section-icon" style="background:${sec.iconBg}">${sec.icon}</div>
        <div class="section-meta">
          <div class="section-title">${sec.title}</div>
          <div class="section-desc">${sec.desc}</div>
        </div>
        <span class="section-count">${filtered.length} ${plural(filtered.length,'тема','темы','тем')}</span>
      </div>
      <div class="topics-grid" id="grid-${sec.id}"></div>
    `;
    main.appendChild(block);
    const grid = block.querySelector(`#grid-${sec.id}`);
    filtered.forEach(t => grid.appendChild(buildCard(t)));
  });

  if (!total) {
    main.innerHTML = '<div class="no-results">Ничего не найдено.</div>';
  }
}

function buildCard(topic) {
  const card = document.createElement('div');
  card.className = 'topic-card' + (expandedCard === topic.name ? ' expanded' : '');

  const tagCls = { method:'tag-method', schema:'tag-schema', scd:'tag-scd', fact:'tag-fact', concept:'tag-concept' }[topic.tag] || 'tag-concept';

  card.innerHTML = `
    <div class="card-top">
      <span class="card-name">${topic.name}</span>
      <span class="card-tag ${tagCls}">${topic.tagLabel}</span>
    </div>
    <div class="card-summary">${topic.summary}</div>
    <div class="card-details">
      <div class="levels">
        <button class="level-btn ${expandedCard === topic.name ? 'lv1' : ''}" data-lv="1">🟡 Кратко</button>
        <button class="level-btn" data-lv="2">🟠 Подробнее</button>
        <button class="level-btn" data-lv="3">🔴 Глубоко</button>
      </div>
      <div class="level-content" data-panel="1">${topic.short}</div>
      <div class="level-content" data-panel="2" style="display:none">
        <p>${topic.medium.theory}</p>
        <div class="tradeoffs">
          <div class="tradeoffs-label">Trade-offs</div>
          ${topic.medium.tradeoffs}
        </div>
        <pre class="diagram">${escHtml(topic.medium.code)}</pre>
        ${topic.tools ? `<div class="tools-row">${topic.tools.map(t => `<span class="tool-chip">${t}</span>`).join('')}</div>` : ''}
      </div>
      <div class="level-content" data-panel="3" style="display:none">
        <div class="questions">
          <div class="questions-label">Вопросы для самопроверки</div>
          ${topic.questions.map(q => `<div class="q-item"><span class="q-arrow">→</span>${q}</div>`).join('')}
        </div>
        <div class="links-row">
          ${topic.links.map(l => `<a class="ext-link" href="${l.url}" target="_blank" rel="noopener">↗ ${l.label}</a>`).join('')}
        </div>
      </div>
    </div>
  `;

  card.addEventListener('click', e => {
    if (e.target.tagName === 'BUTTON' || e.target.tagName === 'A') return;
    expandedCard = expandedCard === topic.name ? null : topic.name;
    render();
  });

  card.querySelectorAll('.level-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const lv = btn.dataset.lv;
      card.querySelectorAll('.level-btn').forEach(b => b.className = 'level-btn');
      btn.classList.add('lv' + lv);
      card.querySelectorAll('[data-panel]').forEach(p => {
        p.style.display = p.dataset.panel === lv ? 'block' : 'none';
      });
    });
  });

  return card;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function plural(n, f1, f2, f5) {
  const v = Math.abs(n) % 100;
  if (v >= 11 && v <= 19) return f5;
  const v2 = v % 10;
  if (v2 === 1) return f1;
  if (v2 >= 2 && v2 <= 4) return f2;
  return f5;
}

buildSidebar();
render();
document.getElementById('search').addEventListener('input', () => { expandedCard = null; render(); });
</script>
</body>
